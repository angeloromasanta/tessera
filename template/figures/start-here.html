<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start here: four steps to connect your AI agent</title>
<!-- The template's hidden first slide: how a person (not an agent) gets from
     this file to a working deck. State 0 (and the last state) is the overview:
     four columns, one per step. Each click zooms into one step, drawn large as
     the screen the person will actually see, and plays it once: the folder,
     the desktop app choosing that folder, the request that builds slides, the
     comments that change them. Plain words: the reader is not technical. -->
<meta name="figcheck-allow" content="state0">
<meta name="poster-settle" content="2">
<style>
@font-face{font-family:Manrope;font-weight:200 800;src:url(MANROPE) format('woff2')}
:root{
  --ink:#1A2326;      /* all dark text */
  --navy:#0D2A2F;     /* dark FILLS only (a header bar, a dark card) */
  --accent:#0F6B73;   /* structure, emphasis fills, arrows, header rules */
  --sky:#2B6CB0;      /* a second blue, only when categories need one */
  --muted:#5A6467;    /* secondary text, eyebrows, legends */
  --faint:#A7AFB1;    /* disabled / greyed-out text */
  --line:#C7CFD1;     /* axes, dead marks */
  --rule:#D7DEDF;     /* hairlines, dividers */
  --tint:#F1F5F5;     /* neutral card fill */
  --blue-tint:#E2F0F1;
  --amber:#BF831A;  --amber-text:#8E5F00; --amber-tint:#FCF0DA;
  --green:#3B9457;  --green-text:#2B7041; --green-tint:#E3F2E6;
  --coral:#D2553A;  --coral-text:#A83A20; --coral-tint:#FBE8E2;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#fff;overflow:hidden;
  font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
#stage{height:100%;display:flex;flex-direction:column;cursor:pointer;
  user-select:none;-webkit-user-select:none;padding:0 28px 4px}
svg{flex:1;width:100%;min-height:0;display:block}
#world{transform-box:view-box;transform-origin:0 0;
  transition:transform 1s cubic-bezier(.4,0,.2,1)}
.el{opacity:0;transition:opacity .5s cubic-bezier(.4,0,.2,1)}
.el.on{opacity:1}
.posed{transform-box:fill-box;transform-origin:center;
  transition:opacity .45s ease,transform .8s cubic-bezier(.22,1,.36,1)}
.el.on.posed{transform:translate(var(--tx,0),var(--ty,0))
  scale(var(--sc,1)) rotate(var(--rot,0deg))}
.el.on.dim{opacity:.22}
.el.on.dead{opacity:.34}
.sel{stroke:var(--ink);stroke-width:3}
/* ---- the zoom ----------------------------------------------------------
   The overview and the four step scenes are the only marks the engine steps.
   A scene grows out of its own column (off, it sits shrunk onto that column's
   card); the overview leaves by pushing in on the column the next scene grows
   from, and comes back the same way. --zx/--zy/--zs and --ox/--oy/--os are set
   from the column geometry in the script. */
.zoom,#ov{transform-box:view-box;transform-origin:0 0;
  transition:transform .8s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.zoom:not(.on){transform:translate(var(--zx),var(--zy)) scale(var(--zs))}
#ov:not(.on){transform:translate(var(--ox,0px),var(--oy,0px)) scale(var(--os,1))}
/* ---- inside a scene: what plays once, after the click ---------------------
   Each part waits --d (seconds) after its scene arrives. Off, a part rests in
   its finished state, so the scene shrinks back complete. */
.in,.flyin,.popin,.growin,.wipe,.typecover,.shrinkx,.pulse{transform-box:fill-box}
.on .in{animation:a-in .55s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@keyframes a-in{from{opacity:0;transform:translateY(16px)}}
.on .flyin{animation:a-fly .95s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@keyframes a-fly{0%{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) scale(var(--fs,1))}12%{opacity:1}}
.popin{transform-origin:center}
.on .popin{animation:a-pop .45s cubic-bezier(.3,1.5,.5,1) var(--d,0s) both}
@keyframes a-pop{from{opacity:0;transform:scale(.3)}}
.growin{transform-origin:50% 100%}
.on .growin{animation:a-grow .7s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@keyframes a-grow{from{transform:scaleY(0)}}
.wipe{transform-origin:0 50%}
.on .wipe{animation:a-wipe .7s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@keyframes a-wipe{from{transform:scaleX(0)}}
/* typing: a cover the colour of the box slides off the words, letter by letter */
.typecover{transform-origin:100% 50%}
.on .typecover{animation:a-type var(--dur,1.2s) steps(20,end) var(--d,0s) both}
@keyframes a-type{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.on .gone{animation:a-gone .3s ease var(--d,0s) both}
@keyframes a-gone{to{opacity:0}}
.shrinkx{transform-origin:0 50%}
.on .shrinkx{animation:a-shrink .6s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@keyframes a-shrink{to{transform:scaleX(.55)}}
.pulse{transform-origin:center}
.on .pulse{animation:a-pulse .45s ease var(--d,0s) 2}
@keyframes a-pulse{50%{transform:scale(1.22)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.15s!important}
  .zoom,#ov{transform:none!important}
}
.head{font-weight:700;font-size:26px;fill:var(--ink)}
.eyebrow,.axis{font-weight:600;font-size:16px;fill:var(--muted);
  letter-spacing:.08em;text-transform:uppercase}
.lbl{font-weight:700;font-size:20px;fill:var(--ink)}
.sub{font-weight:500;font-size:17px;fill:var(--muted)}
.callout{font-weight:700;font-size:20px;fill:var(--accent)}
.big{font-weight:700;font-size:52px;fill:var(--ink)}
.on-dark{fill:#fff}  .on-dark.sub{fill-opacity:.85}
.card{fill:var(--tint)}
/* figure-specific roles: a file or window name, a chat message, a name in a list */
.file{font-weight:600;font-size:16px;fill:var(--ink)}
.file.muted{fill:var(--muted)}
.msg{font-weight:600;font-size:17px;fill:var(--ink)}
.msg.ok{font-weight:700;fill:var(--green-text)}
.say{font-weight:600;font-size:20px;fill:var(--ink)}
.say.ok{font-weight:700;fill:var(--green-text)}
.hint{font-weight:500;font-size:20px;fill:var(--faint)}
.name{font-weight:600;font-size:20px;fill:var(--ink)}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;
  padding:6px 0 4px;font-size:13px;color:var(--muted)}
#dots{display:flex;gap:7px}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--rule);transition:background .3s}
#dots i.on{background:var(--accent)}
#hint{margin-left:auto;opacity:.75}
</style></head>
<body>
<div id="stage">
<svg id="fig" viewBox="0 0 1280 480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5"
            orient="auto"><path d="M0,1.2 L9,5 L0,8.8 z" style="fill:var(--accent)"/></marker>
  </defs>
  <g id="world" data-figcheck="camera">
    <g id="ov" class="el"></g>
    <g id="sc1" class="el zoom"></g>
    <g id="sc2" class="el zoom"></g>
    <g id="sc3" class="el zoom"></g>
    <g id="sc4" class="el zoom"></g>
  </g>
</svg>
<div id="bar"><div id="dots"></div><div id="hint"></div></div>
</div>

<script>
// The files the person was sent. One line, so a brand kit can swap it.
const FILES = ["template.html"];
// The four steps: the words under each column of the overview, and the one
// line each step's own screen says under its name. Every line is editable.
const COPY = [
  { head: 'Make one folder',     sub: ['Save this .html file, and', 'anything sent with it,', 'in one new folder.'],
    line: 'Put the file you were sent, and anything that came with it, in one new folder.' },
  { head: 'Connect your agent',  sub: ['Open that folder in the', 'Claude or ChatGPT', 'desktop app and ask it.'],
    line: 'In the Claude or ChatGPT desktop app, choose that folder, then ask it to connect.' },
  { head: 'Ask for your slides', sub: ['Say what your talk is', 'about. The slides land', 'in this file as you watch.'],
    line: 'Say what your talk is about: the slides appear in your open deck as they are made.' },
  { head: 'Comment to improve',  sub: ['Type a change beside any', 'slide, then tell the agent', '“Do my comments.”'],
    line: 'Type what should change beside any slide, then tell the agent “Do my comments.”' },
];
// Overview geometry: four columns, a stage card on top, words below.
const X0 = 56, CW = 274, GAP = 24, STEP = CW + GAP, CARD_Y = 8, CARD_H = 292;
const col = k => X0 + k * STEP;

const SVG = 'http://www.w3.org/2000/svg';
const C = (() => {
  const root = [...document.styleSheets[0].cssRules].find(r => r.selectorText === ':root');
  return Object.fromEntries([...root.style].filter(p => p.startsWith('--'))
    .map(p => [p.slice(2), root.style.getPropertyValue(p).trim()]));
})();
function mk(tag, attrs, parent) {
  const e = document.createElementNS(SVG, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const T = (k, d) => (window.TESSERA_EMBED && TESSERA_EMBED.text) ? TESSERA_EMBED.text(k, d) : d;
function txt(key, text, attrs, parent) {
  const t = mk('text', { ...attrs, 'data-edit': key }, parent);
  t.textContent = T(key, text);
  return t;
}
const FIT = [];
function refit() { FIT.forEach(f => f()); }
window.TESSERA_REFIT = refit;
document.fonts.ready.then(refit);
document.fonts.addEventListener('loadingdone', refit);
new ResizeObserver(refit).observe(document.getElementById('fig'));

const VBW = 1280, VBH = 480;
const FULL = [0, 0, VBW, VBH];
const world = document.getElementById('world');
function camTo(rect) {
  const [x, y, w, h] = rect;
  const s = Math.min(VBW / w, VBH / h, 3.2);
  world.style.transform = `translate(${(VBW / 2 - s * (x + w / 2)).toFixed(2)}px,`
    + `${(VBH / 2 - s * (y + h / 2)).toFixed(2)}px) scale(${s.toFixed(4)})`;
}

/* ---- small parts ------------------------------------------------------ */
const fill = v => `fill:var(--${v})`;
const G = (parent, attrs = {}) => mk('g', attrs, parent);
// a part that plays after its scene arrives: class (in, flyin, popin…) and delay in s
function play(e, cls, d = 0, vars = {}) {
  e.classList.add(...cls.split(' '));
  e.style.setProperty('--d', d + 's');
  for (const k in vars) e.style.setProperty('--' + k, vars[k]);
  return e;
}
// A chat message: a rounded bubble sized from its lines (measured on FIT).
// align 'right' = the person speaking (anchored at its right edge x), 'left' = the agent.
function bubble(parent, keys, lines, x, y, { align = 'right', bg = 'blue-tint', cls = 'msg', lh = 23, icon = null } = {}) {
  const g = G(parent);
  const r = mk('rect', { rx: 12, style: fill(bg) }, g);
  const ix = icon ? 30 : 0;
  const ts = lines.map((s, n) => txt(keys[n], s, { class: cls, x: align === 'right' ? x - 14 : x + 14 + ix,
    y: y + lh + 3 + n * lh, 'text-anchor': align === 'right' ? 'end' : 'start' }, g));
  const ic = icon ? icon(g) : null;
  const fit = () => {
    let w = 0; ts.forEach(t => { try { w = Math.max(w, t.getBBox().width); } catch (e) {} });
    w = Math.max(w, 20) + 28 + ix;
    r.setAttribute('x', align === 'right' ? x - w : x); r.setAttribute('y', y);
    r.setAttribute('width', w); r.setAttribute('height', 16 + lines.length * lh);
    if (ic) ic.setAttribute('transform', `translate(${x + 14},${y + 8 + (lines.length * lh - 20) / 2})`);
  };
  fit(); FIT.push(fit);
  return g;
}
// Words typed into a box: the text, and a cover in the box's colour that slides off it.
function typed(parent, key, text, x, y, cls, bg, d, dur = 1.2) {
  const g = G(parent);
  const t = txt(key, text, { class: cls, x, y }, g);
  const cover = mk('rect', { style: bg === 'white' ? 'fill:#fff' : fill(bg) }, g);
  play(cover, 'typecover', d, { dur: dur + 's' });
  const fit = () => { try { const b = t.getBBox();
    cover.setAttribute('x', b.x - 1); cover.setAttribute('y', b.y - 1);
    cover.setAttribute('width', b.width + 4); cover.setAttribute('height', b.height + 2); } catch (e) {} };
  fit(); FIT.push(fit);
  return g;
}
// A green tick in a circle, 20 across, drawn at (0,0)-(20,20).
function tick(parent) {
  const g = G(parent);
  mk('circle', { cx: 10, cy: 10, r: 10, style: fill('green') }, g);
  mk('path', { d: 'M5.5,10.5 L8.8,13.6 L14.6,7', fill: 'none', stroke: '#fff', 'stroke-width': 2.4,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  return g;
}
// An app or browser window: frame, title bar with three dots and a name.
function win(parent, x, y, w, h, key, name, bar = 34) {
  mk('rect', { x, y, width: w, height: h, rx: 10, fill: '#fff', style: 'stroke:var(--line)', 'stroke-width': 2 }, parent);
  mk('path', { d: `M${x + 1},${y + bar - 1} V${y + 10} a9,9 0 0 1 9,-9 H${x + w - 10} a9,9 0 0 1 9,9 V${y + bar - 1} Z`, style: fill('tint') }, parent);
  mk('line', { x1: x, y1: y + bar - 1, x2: x + w, y2: y + bar - 1, style: 'stroke:var(--rule)', 'stroke-width': 1.5 }, parent);
  [0, 1, 2].forEach(n => mk('circle', { cx: x + 18 + n * 13, cy: y + bar / 2, r: 4.5, style: fill('line') }, parent));
  txt(key, name, { class: 'file muted', x: x + 60, y: y + bar / 2 + 5.5 }, parent);
}
// A slide thumbnail: frame, title bar, two text lines.
function thumb(g, x, y, w, h, { title = true, sel = false } = {}) {
  mk('rect', { x, y, width: w, height: h, rx: 3, fill: '#fff', style: `stroke:var(--${sel ? 'accent' : 'line'})`, 'stroke-width': sel ? 2.5 : 1.5 }, g);
  if (title) mk('rect', { x: x + w * .1, y: y + h * .16, width: w * .45, height: Math.max(4, h * .1), rx: 1.5, style: fill('accent') }, g);
  mk('rect', { x: x + w * .1, y: y + h * .42, width: w * .7, height: Math.max(3, h * .06), rx: 1.5, style: fill('line') }, g);
  mk('rect', { x: x + w * .1, y: y + h * .58, width: w * .5, height: Math.max(3, h * .06), rx: 1.5, style: fill('line') }, g);
  return g;
}
function folderGlyph(g, x, y, w, h, c = 'amber') {
  mk('rect', { x, y: y - h * .18, width: w * .4, height: h * .3, rx: 3, style: fill(c) }, g);
  mk('rect', { x, y, width: w, height: h, rx: 4, style: fill(c) }, g);
}
function fileGlyph(g, x, y, name, w = 19, h = 24) {
  const c = /\.zip$/i.test(name) ? 'sky' : /\.html?$/i.test(name) ? 'accent' : 'line';
  mk('path', { d: `M${x},${y} h${w - 6} l6,6 v${h - 6} h-${w} z`, style: fill(c) }, g);
}
// A pointy-top hexagon centred on (cx, cy), radius r: the title slide's tile.
function hexPath(cx, cy, r) {
  return 'M' + [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 3 * i - Math.PI / 2;
    return `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`; }).join(' L') + ' Z';
}
// A field of hexagons, cols × rows from (x, y), with a few gaps; colour and
// delay come back per tile from tile(c, r, cx, cy) -> [colour, delay] or null.
function hexField(g, x, y, R, cols, rows, tile) {
  const HW = Math.sqrt(3) * R;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cx = x + c * HW + (r % 2) * HW / 2, cy = y + r * 1.5 * R, t = tile(c, r, cx, cy);
    if (!t) continue;
    const h = mk('path', { d: hexPath(cx, cy, R - Math.max(1.5, R * .1)), style: fill(t[0]) }, g);
    if (t[1] != null) play(h, 'popin', t[1]);
  }
}
const HEXES = (c, r) => { const h = (c * 7 + r * 11 + c * r) % 9;
  return h === 0 ? null : c === 4 && r === 3 ? 'amber' : h < 3 ? 'accent' : h < 5 ? 'sky' : 'blue-tint'; };
// a scene's own header: the step's number, name and one line
function header(g, k) {
  mk('circle', { cx: 76, cy: 30, r: 20, style: fill('accent') }, g);
  mk('text', { class: 'lbl on-dark', x: 76, y: 37, 'text-anchor': 'middle', 'data-no-edit': '' }, g).textContent = k + 1;
  txt(`s${k + 1}-head`, COPY[k].head, { class: 'head', x: 108, y: 39 }, g);
  txt(`s${k + 1}-line`, COPY[k].line, { class: 'sub', x: 108, y: 66 }, g);
}

/* ---- the overview: the four steps side by side, each finished ----------- */
const ov = document.getElementById('ov');
for (let k = 0; k < 4; k++) {
  const x = col(k);
  mk('rect', { class: 'card', x, y: CARD_Y, width: CW, height: CARD_H, rx: 8 }, ov);
  mk('circle', { cx: x + 16, cy: 336, r: 16, style: fill('accent') }, ov);
  mk('text', { class: 'lbl on-dark', x: x + 16, y: 343, 'text-anchor': 'middle', 'data-no-edit': '' }, ov).textContent = k + 1;
  txt(`s${k + 1}-head`, COPY[k].head, { class: 'lbl', x: x + 42, y: 343 }, ov);
  COPY[k].sub.forEach((s, n) => txt(`s${k + 1}-sub${n + 1}`, s, { class: 'sub', x, y: 378 + n * 23 }, ov));
}
{ // 1. the files in one folder
  const x = col(0);
  mk('rect', { x: x + 17, y: 116, width: 80, height: 28, rx: 6, style: fill('amber') }, ov);
  mk('rect', { x: x + 17, y: 132, width: 240, height: 138, rx: 8, style: fill('amber') }, ov);
  const ys = FILES.length === 1 ? [154] : FILES.map((_, n) => 146 + n * 32);
  FILES.forEach((name, n) => {
    mk('rect', { x: x + 27, y: ys[n], width: 220, height: 44, rx: 6, fill: '#fff', style: 'stroke:var(--line)', 'stroke-width': 1.5 }, ov);
    fileGlyph(ov, x + 40, ys[n] + 10, name);
    txt(`f${n + 1}`, name, { class: 'file', x: x + 69, y: ys[n] + 27 }, ov);
  });
  mk('rect', { x: x + 17, y: 210, width: 240, height: 60, rx: 8, style: 'fill:var(--amber-tint);stroke:var(--amber)', 'stroke-width': 2 }, ov);
  txt('folder', 'My talk', { class: 'lbl', x: x + 137, y: 247, 'text-anchor': 'middle', style: fill('amber-text') }, ov);
}
{ // 2. the folder in the app, connected
  const x = col(1);
  win(ov, x + 14, 24, 246, 262, 'app', 'Claude or ChatGPT');
  bubble(ov, ['b-ask1', 'b-ask2'], ['Read this deck’s notes', 'and connect to it.'], x + 248, 70);
  bubble(ov, ['b-ok'], ['Connected'], x + 26, 144, { align: 'left', bg: 'green-tint', cls: 'msg ok', icon: tick });
  // the box to type in, and the folder picker under it
  mk('rect', { x: x + 26, y: 198, width: 222, height: 34, rx: 10, fill: '#fff', style: 'stroke:var(--line)', 'stroke-width': 1.5 }, ov);
  mk('rect', { x: x + 26, y: 242, width: 124, height: 32, rx: 8, fill: '#fff', style: 'stroke:var(--line)', 'stroke-width': 1.5 }, ov);
  folderGlyph(ov, x + 36, 253, 20, 14);
  txt('folder', 'My talk', { class: 'file', x: x + 64, y: 264 }, ov);
}
{ // 3. the request, the slides in the deck
  const x = col(2);
  win(ov, x + 14, 108, 246, 178, 'deck', FILES[0]);
  bubble(ov, ['c-ask1', 'c-ask2'], ['Make 10 slides about', 'my topic.'], x + 260, 24);
  for (let n = 0; n < 6; n++) thumb(ov, x + 30 + (n % 3) * 76, 156 + Math.floor(n / 3) * 56, 66, 42);
}
{ // 4. the comment, the slide it changed
  const x = col(3);
  mk('rect', { x: x + 14, y: 26, width: 246, height: 44, rx: 6, fill: '#fff', style: 'stroke:var(--rule)', 'stroke-width': 1.5 }, ov);
  txt('d-cm', 'Make it more interactive', { class: 'file', x: x + 26, y: 54 }, ov);
  mk('rect', { x: x + 14, y: 86, width: 246, height: 132, rx: 4, fill: '#fff', style: 'stroke:var(--line)', 'stroke-width': 1.5 }, ov);
  mk('rect', { x: x + 28, y: 108, width: 84, height: 9, rx: 2, style: fill('accent') }, ov);
  mk('rect', { x: x + 28, y: 126, width: 64, height: 5, rx: 2, style: fill('line') }, ov);
  hexField(ov, x + 134, 112, 9, 7, 7, (c, r) => { const t = HEXES(c, r); return t && [t, null]; });
  tick(ov).setAttribute('transform', `translate(${x + 248},${76})`);
  bubble(ov, ['d-ask'], ['Do my comments.'], x + 260, 236);
}

/* ---- scene 1: the files go into a new folder ---------------------------- */
{
  const g = document.getElementById('sc1');
  header(g, 0);
  win(g, 56, 90, 500, 370, 'w-down', 'Downloads', 40);
  const rows = [...FILES.map(f => [f, true]), ['Holiday photo.jpg', false], ['Invoice.pdf', false]];
  const kind = n => /\.html?$/i.test(n) ? 'Web page' : /\.zip$/i.test(n) ? 'Zip file' : /\.pdf$/i.test(n) ? 'PDF' : 'Picture';
  rows.forEach(([name, ours], r) => {
    const y = 160 + r * 56, row = G(g);
    if (ours) play(mk('rect', { x: 70, y: y - 34, width: 472, height: 48, rx: 8, style: fill('blue-tint') }, row), 'in', .4 + .2 * r);
    fileGlyph(row, 88, y - 22, name, 21, 27);
    txt(ours ? `f${r + 1}` : `w-other${r}`, name, { class: 'name', x: 124, y, style: ours ? '' : fill('faint') }, row);
    txt(`w-kind${r}`, kind(name), { class: 'sub', x: 420, y, style: ours ? '' : fill('faint') }, row);
    if (ours) play(row, 'gone', 1.9 + .45 * r);
  });
  // the new folder, then the files moving into it
  const right = play(G(g), 'in', .9);

/* ---- where each scene sits when it is not shown: shrunk onto its column -- */
const ZS = CW / VBW;
['sc1', 'sc2', 'sc3', 'sc4'].forEach((id, k) => {
  const e = document.getElementById(id), cx = col(k) + CW / 2, cy = CARD_Y + CARD_H / 2;
  e.style.setProperty('--zs', ZS);
  e.style.setProperty('--zx', `${cx - ZS * VBW / 2}px`);
  e.style.setProperty('--zy', `${cy - ZS * VBH / 2}px`);
});
// the overview leaves (and comes back) by pushing in on column k
function ovTo(k) {
  const s = VBW / CW, cx = col(k) + CW / 2, cy = CARD_Y + CARD_H / 2;
  ov.style.setProperty('--os', s);
  ov.style.setProperty('--ox', `${VBW / 2 - s * cx}px`);
  ov.style.setProperty('--oy', `${VBH / 2 - s * cy}px`);
}

// State 0 and the last state: the overview. Clicks 1-4: one step each, large,
// playing once. Nothing moves on its own between clicks.
const steps = [
  { on: ['ov'], do: () => ovTo(0) },
  { on: ['sc1'], do: () => ovTo(0) },
  { on: ['sc2'] },
  { on: ['sc3'] },
  { on: ['sc4'], do: () => ovTo(3) },
  { on: ['ov'], do: () => ovTo(3) },
];

/* ---- engine: nothing below needs editing ----------------------------- */
document.querySelectorAll('.draw').forEach(p => {
  const L = p.getTotalLength();                 // self-measuring, so no magic
  p.style.strokeDasharray = L + ' ' + L;        // dash numbers to maintain
  p.style.setProperty('--len', L);
});

let i = 0;
const els = [...document.querySelectorAll('.el')];
// Only marks some step actually poses get .posed, so nothing else can change
// behaviour — in particular a mark carrying its own transform attribute.
const POSED = new Set();
steps.forEach(s => Object.keys(s.pose || {}).forEach(id => POSED.add(id)));
POSED.forEach(id => document.getElementById(id)?.classList.add('posed'));
function setPose(e, p) {
  e.style.setProperty('--tx', (p.x || 0) + 'px');   // px in SVG CSS = 1 viewBox unit
  e.style.setProperty('--ty', (p.y || 0) + 'px');
  e.style.setProperty('--sc', p.s == null ? 1 : p.s);
  e.style.setProperty('--rot', (p.r || 0) + 'deg');
}
const dotBox = document.getElementById('dots');
dotBox.innerHTML = steps.map(() => '<i></i>').join('');
const dots = [...dotBox.children];
function draw() {
  refit();
  const s = steps[i];
  els.forEach(e => {
    e.classList.toggle('on', s.on.includes(e.id));
    for (const k of ['dim', 'dead', 'sel'])
      e.classList.toggle(k, (s[k] || []).includes(e.id));
    if (POSED.has(e.id)) {
      const p = (s.pose || {})[e.id];
      setPose(e, (typeof p === 'function' ? p() : p) || {});
    }
  });
  if (s.do) s.do(s);
  camTo(typeof s.cam === 'function' ? s.cam() : (s.cam || FULL));
  dots.forEach((d, n) => d.classList.toggle('on', n <= i));
  document.getElementById('hint').textContent =
    i === steps.length - 1 ? 'click to restart' : 'click to advance';
}
function go(n) { i = (n + steps.length) % steps.length; draw(); }
// A click steps. On the deck's edit canvas the deck itself tells a click on a
// label from a double-click (which edits it): no guard is needed here.
document.getElementById('stage').addEventListener('click', () => go(i + 1));
// Keys step the build and STOP at either end, leaving the key unhandled: in a
// deck that is what moves the show to the next (or previous) slide, like
// PowerPoint animations. TESSERA_STEPPED tells the deck to offer this page its
// arrow keys first. A click still wraps back to the start.
window.TESSERA_STEPPED = true;
addEventListener('keydown', e => {
  const fwd = ['ArrowRight', ' ', 'Enter', 'PageDown'].includes(e.key);
  const back = ['ArrowLeft', 'PageUp'].includes(e.key);
  if (fwd && i < steps.length - 1) { go(i + 1); e.preventDefault(); }
  if (back && i > 0) { go(i - 1); e.preventDefault(); }
  if (e.key === 'Home') { go(0); e.preventDefault(); }
});
draw();
</script>

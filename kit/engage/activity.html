<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Activity</title>
<!--
  STARTER for an `activity` poll: a page the DECK ships to every phone in
  the room. Copy it, edit the CONFIG block, leave the engine alone.

  How it gets there: the slide's poll element carries kind:"activity" and
  activityAsset (a doc.assets key holding this file's text). On the first
  slide-enter of a live show the deck publishes it to the poll service, and
  every phone that joins fetches it into a sandboxed iframe on the join page.

  The four rules the sandbox imposes — none of them optional:

  1. SELF-CONTAINED. One file. No CDN, no web fonts, no imports. It is stored
     as one string and served as srcdoc.
  2. NO STORAGE. The frame runs with an opaque origin (allow-scripts without
     allow-same-origin), so localStorage/sessionStorage THROW. Keep state in
     variables. A phone that reloads starts over — design for that.
  3. ONE STRING BACK. Answers are posted to /api/answer as a single string.
     By convention that string is JSON with a numeric `score`, because that is
     what the slide's leaderboard reads; anything else is stored and exported
     but shows unranked.
  4. UNDER 60 000 CHARACTERS. The service refuses more, at publish time, on
     stage.

  The host hands the page `window.TESSERA_ACTIVITY = { code, name }` — the
  answer bucket to post to, and the name the join page collected if the poll
  set requireName (otherwise empty).

  Its strings can be reworded in the deck: when the slide also carries a
  screen embed, the deck publishes this page with that embed's `texts` in
  front (window.TESSERA_EMBED.texts) and TX() lets them win over CONFIG. The
  keys are the CONFIG paths: title, intro, questions.N.q, questions.N.options.M.
-->
<style>
  :root {
    --ink: #1A2326; --accent: #0F6B73; --muted: #5A6467;
    --line: #C7CFD1; --ok: #3B9457; --bad: #D2553A; --bg: #fff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
    padding: 16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .hide { display: none !important; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { margin: 0 0 18px; color: var(--muted); }
  .bar { display: flex; justify-content: space-between; align-items: center;
         font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .clock { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
  .clock.low { color: var(--bad); }
  .q { font-size: 19px; font-weight: 600; margin: 0 0 14px; }
  button {
    font: inherit; width: 100%; text-align: left; padding: 14px 16px;
    margin-bottom: 10px; border: 1px solid var(--line); border-radius: 12px;
    background: #fff; color: var(--ink); cursor: pointer;
    /* 44px+ tap targets: this is read at arm's length in a lecture hall */
    min-height: 52px;
  }
  button:active { transform: scale(.99); }
  button.correct { border-color: var(--ok); background: rgba(59,148,87,.10); }
  button.wrong { border-color: var(--bad); background: rgba(210,85,58,.10); }
  button[disabled] { opacity: .75; cursor: default; }
  .cta { text-align: center; font-weight: 600; background: var(--accent);
         color: #fff; border-color: var(--accent); }
  .score { font-size: 44px; font-weight: 800; color: var(--accent);
           font-variant-numeric: tabular-nums; }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; }
  .fill { flex: 1; }
</style>
</head>
<body>

<!-- ─────────────────────────────── screens ─────────────────────────────── -->
<div id="intro">
  <h1 id="introTitle">Quick quiz</h1>
  <p class="sub" id="introSub"></p>
  <button class="cta" id="start">Start</button>
</div>

<div id="play" class="hide fill">
  <div class="bar"><span id="progress"></span><span class="clock" id="clock"></span></div>
  <p class="q" id="question"></p>
  <div id="options"></div>
</div>

<div id="done" class="hide">
  <h1>Done</h1>
  <p class="score" id="finalScore"></p>
  <p class="sub" id="doneSub">Sending your score…</p>
  <button class="cta hide" id="retry">Try sending again</button>
  <p class="err hide" id="err"></p>
</div>

<script>
/* ══════════════════════════════ CONFIG ══════════════════════════════
   Edit this block. Everything below it is the engine.
   `correct` indexes into that question's own options.                  */

const CONFIG = {
  title: "Quick quiz",
  intro: "{n} questions, {secs} seconds. Fastest correct score wins.",
  seconds: 60,
  // Show the right/wrong answer after each tap? Off keeps a class honest
  // when the slide reveals the answers afterwards.
  reveal: true,
  questions: [
    { q: "Which ocean is the largest?",
      options: ["Atlantic", "Pacific", "Indian"], correct: 1 },
    { q: "What is 7 × 8?",
      options: ["54", "56", "63"], correct: 1 },
    { q: "Which of these is a prime number?",
      options: ["21", "17", "27"], correct: 1 },
  ],
};

/* ══════════════════════════════ ENGINE ══════════════════════════════ */

const HOST = window.TESSERA_ACTIVITY || { code: "", name: "" };
const $ = (id) => document.getElementById(id);
/* the deck's reworded labels (TESSERA_EMBED.texts, put in front of this page
   when it is published) win over CONFIG; KEY is the CONFIG path */
const TX = (k, d) => { const E = window.TESSERA_EMBED, T = E && E.texts;
  d = d == null ? "" : d;
  return E && typeof E.text === "function" ? E.text(k, d) : T && Object.prototype.hasOwnProperty.call(T, k) ? T[k] : d; };
const TITLE = TX("title", CONFIG.title);
const show = (el, on) => el.classList.toggle("hide", !on);

let i = 0, score = 0, left = CONFIG.seconds, timer = 0, started = 0, sent = false;

$("introTitle").textContent = TITLE;
$("introSub").textContent = TX("intro", CONFIG.intro)
  .replace("{n}", CONFIG.questions.length)
  .replace("{secs}", CONFIG.seconds);
$("start").addEventListener("click", start);
$("retry").addEventListener("click", send);

function start() {
  show($("intro"), false);
  show($("play"), true);
  started = Date.now();
  tick();
  timer = setInterval(tick, 1000);
  draw();
}

function tick() {
  $("clock").textContent = left + "s";
  $("clock").classList.toggle("low", left <= 10);
  if (left-- <= 0) finish();
}

function draw() {
  const q = CONFIG.questions[i];
  $("progress").textContent = `Question ${i + 1} of ${CONFIG.questions.length}`;
  $("question").textContent = TX(`questions.${i}.q`, q.q);
  const box = $("options");
  box.textContent = "";
  q.options.forEach((opt, n) => {
    const b = document.createElement("button");
    b.textContent = TX(`questions.${i}.options.${n}`, opt);
    b.addEventListener("click", () => answer(n, b));
    box.appendChild(b);
  });
}

function answer(n, btn) {
  const q = CONFIG.questions[i];
  const right = n === q.correct;
  if (right) score++;
  const buttons = [...$("options").querySelectorAll("button")];
  for (const b of buttons) b.disabled = true;
  if (CONFIG.reveal) {
    btn.classList.add(right ? "correct" : "wrong");
    if (!right) buttons[q.correct].classList.add("correct");
  }
  // A beat to read the result, then move on. Short: the room is waiting.
  setTimeout(() => {
    i++;
    if (i >= CONFIG.questions.length) finish(); else draw();
  }, CONFIG.reveal ? 700 : 120);
}

function finish() {
  clearInterval(timer);
  show($("play"), false);
  show($("done"), true);
  $("finalScore").textContent = `${score} / ${CONFIG.questions.length}`;
  send();
}

/** The one place anything leaves this page. ONE string, JSON by convention —
 *  `score` is what the slide ranks; the rest rides along into the export. */
async function send() {
  if (sent) return;
  show($("err"), false);
  show($("retry"), false);
  $("doneSub").textContent = "Sending your score…";
  const payload = JSON.stringify({
    score: score,
    total: CONFIG.questions.length,
    secs: Math.min(CONFIG.seconds, Math.round((Date.now() - started) / 1000)),
  });
  try {
    const r = await fetch("/api/answer", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        code: HOST.code,
        text: payload,
        question: TITLE,
        name: HOST.name || "",
      }),
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.error || ("HTTP " + r.status));
    }
    sent = true;
    $("doneSub").textContent = HOST.name
      ? `Sent as ${HOST.name}. Look up — the scores go on the screen.`
      : "Sent. Look up — the scores go on the screen.";
  } catch (e) {
    $("doneSub").textContent = "Your score is not in yet.";
    $("err").textContent = String(e.message || e);
    show($("err"), true);
    show($("retry"), true);
  }
}
</script>
</body>
</html>

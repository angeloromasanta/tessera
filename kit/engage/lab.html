<!--
  Lab slide, screen side (engage). A full-width `embed` (1280 x 500, under the
  slide's own title) over a hidden `activity` poll on the same slide, whose phone page
  is lab-phone.html. make_lab.py fills the CONFIG block below; never edit a generated copy.

    left    one light card: the instruction (`do`), 1 to 3 prompt boxes (`types`, side by
            side; [..] in a prompt is a placeholder), and a closing line (`tip`)
    right   a countdown, and under it the room: Lost / Working on it / Finished, the latest
            check-in of every phone, read from the activity's bucket every 4 s

  `context` is for the AI helper on the phones (the server reads it from the published
  activity page). It is never shown here.

  The room. window.TESSERA_EMBED.poll.previous is the nearest poll at or before this slide;
  it is read only when its question starts with "Lab check-in" (the lab's own activity).
  Each answer's text is JSON {v:1, pid, st}, st = lost | working | finished; the latest
  answer per pid counts. answers[] needs the lecturer key (x-tessera-lecturer); without it
  the panel says so instead of drawing zeros. A failed request keeps the last numbers,
  dimmed. Opened with no TESSERA_EMBED (the poster, the editor canvas, shoot.py), or with no
  lab check-in poll before it, the panel shows a sample, tagged "sample".

  Drawn on a 1280 x 500 stage; it scales itself to whatever box it lands in and stays
  centred (also when the frame has no size yet: a slideshow started on this slide).

  On stage:
    Space             start / pause the countdown. Works as soon as the slide is up, because
                      the deck offers Space to this page first. A held Space or a double click
                      counts once; after a start or a pause, Space does nothing for about a
                      second; and Space that arrives with the slide is ignored.
  After one click into the page (the frame then has the keyboard):
    + / -             one minute more / less (minus never takes the countdown under 30 seconds)
    R                 reset the countdown
  Left, right and the Page keys are never taken, so the presenter can always leave the slide.
  Any other key belongs to the deck: the page hands the keyboard back. A button never takes
  the keyboard at all, because the deck does not pass on keys that land on a button.

  Sandbox rules: one file, no CDN, no storage. The only network call is GET /api/poll.
-->

  :root{
    --ink:#1A2326; --navy:#0D2A2F; --accent:#0F6B73; --sky:#2B6CB0;
    --muted:#5A6467; --faint:#A7AFB1; --line:#C7CFD1; --rule:#D7DEDF;
    --tint:#F1F5F5; --blue-tint:#E2F0F1;
    --coral:#D2553A; --coral-text:#A83A20;
    /* the room */
    --lost:#D63A3F; --working:#E8A33D; --finished:#2E9E6A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:#FFFFFF;color:var(--ink);user-select:none;
       font:16px/1.35 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  /* centred in any box; the script adds the scale */
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:500px;
         transform:translate(-50%,-50%);transform-origin:center center}

  /* ── card ── */
  #card{position:absolute;left:40px;top:14px;width:888px;height:472px;border-radius:16px;
        background:var(--tint);overflow:hidden}
  #inner{position:absolute;inset:0;padding:34px 40px 30px;display:flex;flex-direction:column}
  .do{font-size:29px;font-weight:600;line-height:1.26;color:var(--ink)}
  .types{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:18px;margin:auto 0}
  .type{display:block;margin:0;padding:18px 24px 22px;border-radius:12px;background:#fff;
        border-left:5px solid var(--accent);white-space:pre-line;
        font:600 25px/1.36 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink)}
  .types.one .type{font-size:27px}
  .types.three{gap:14px}
  .types.three .type{font-size:21px;padding:16px 18px 20px}
  .type i{display:block;margin-bottom:8px;font:700 14px/1.2 Manrope,sans-serif;font-style:normal;
        letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
  .types.three .type i{letter-spacing:1.2px}
  .type span{display:block}   /* the prompt: one box, so a double-click anywhere on it edits it */
  .type b.ph{font-weight:700;color:#D63A3F;background:#FDE8E8;padding:1px 6px;border-radius:6px}
  /* steps: the task in plain words, numbered, no prompt to type */
  .steps{list-style:none;counter-reset:st;margin:auto 0;display:flex;flex-direction:column;gap:22px}
  .steps li{counter-increment:st;display:flex;align-items:flex-start;gap:20px;font-size:30px;font-weight:600;line-height:1.3;color:var(--ink)}
  .steps li::before{content:counter(st);flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;
        font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-6px}
  .tip{font-size:22px;font-weight:600;line-height:1.3;color:var(--muted)}

  /* ── countdown ── */
  #clockcol{position:absolute;left:944px;top:6px;width:308px;display:flex;flex-direction:column;align-items:center}
  #dial{position:relative;width:200px;height:200px;cursor:pointer}
  #dial svg{width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--rule);stroke-width:12}
  .sweep{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;
         transition:stroke-dashoffset .3s linear,stroke .4s ease}
  #clock{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  #time{font-size:54px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
  #state{margin-top:6px;font-size:15px;font-weight:700;color:var(--muted)}
  body.warn .sweep,body.over .sweep{stroke:var(--coral)}
  body.warn #time,body.over #time{color:var(--coral)}
  body.over #state{color:var(--coral-text)}
  body.over #dial{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  #controls{display:flex;align-items:center;margin-top:10px;gap:10px;justify-content:center}
  button{font:inherit;font-weight:700;cursor:pointer;color:var(--ink);background:#fff;
         border:1.5px solid var(--rule);border-radius:999px;padding:0 16px;height:40px;
         transition:background .15s ease,border-color .15s ease,opacity .15s ease}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.35;cursor:default}
  .adj{width:40px;padding:0;font-size:22px;line-height:1;background:var(--tint);border-color:var(--tint)}
  #len{min-width:62px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  #go{background:var(--accent);border-color:var(--accent);color:#fff;font-size:17px;min-width:96px}
  #hint{margin-top:7px;font-size:14px;line-height:1.5;color:var(--muted);text-align:center}
  kbd{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--rule);border-radius:5px;
      padding:0 5px;color:var(--ink);background:var(--tint)}

  /* ── the room ── */
  #room{align-self:stretch;margin-top:12px;padding-top:11px;border-top:1.5px solid var(--rule)}
  #roomhead{display:flex;justify-content:space-between;align-items:baseline;
            font-size:14px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  #roomnote{letter-spacing:0;text-transform:none;font-size:15px;font-weight:700;color:var(--ink)}
  #roomnote.tag{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
                border:1px solid var(--line);border-radius:5px;padding:0 6px}
  #roombar{display:flex;height:20px;margin-top:8px;border-radius:10px;overflow:hidden;background:var(--rule)}
  #roombar i{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.3,.7,.2,1)}
  #roombar i+i{box-shadow:inset 2px 0 0 #fff}
  #roombar .lost{background:var(--lost)} #roombar .working{background:var(--working)} #roombar .finished{background:var(--finished)}
  #legend{display:grid;grid-template-columns:auto auto auto;justify-content:space-between;margin-top:6px}
  .lg b{display:block;font-size:30px;font-weight:800;line-height:1.08;font-variant-numeric:tabular-nums}
  .lg span{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted)}
  .lg span::before{content:"";width:11px;height:11px;border-radius:3px;background:currentColor}
  .lg.lost span::before{background:var(--lost)} .lg.working span::before{background:var(--working)}
  .lg.finished span::before{background:var(--finished)}
  .lg.finished{text-align:right} .lg.finished span{justify-content:flex-end}
  .lg.working{text-align:center} .lg.working span{justify-content:center}
  #roomdata{transition:opacity .4s ease}
  #room.stale #roomdata,#room.stale #roomnote{opacity:.4}
  #roomnote{transition:opacity .4s ease}
  #withheld{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--tint);
            font-size:16px;font-weight:600;line-height:1.3;color:var(--ink);text-align:center}
  #help{margin-top:9px;font-size:15px;font-weight:600;line-height:1.3;color:var(--muted);text-align:center}
  #join{display:block;margin-top:1px;font-size:18px;font-weight:700;color:var(--accent);white-space:nowrap}
  [hidden]{display:none !important}
  @media (prefers-reduced-motion:reduce){#roombar i{transition:none}body.over #dial{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="card"><div id="inner"></div></div>
  <div id="clockcol">
    <div id="dial" title="Click to start or pause">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="92"></circle>
        <circle class="sweep" id="sweep" cx="100" cy="100" r="92"></circle>
      </svg>
      <div id="clock" data-no-edit><div id="time">0:00</div><div id="state">Ready</div></div>
    </div>
    <div id="controls" data-no-edit>
      <button class="adj" id="minus" tabindex="-1" title="One minute less">&minus;</button>
      <div id="len"></div>
      <button class="adj" id="plus" tabindex="-1" title="One minute more">+</button>
      <button id="go" tabindex="-1">Start</button>
    </div>
    <div id="hint"><kbd data-no-edit>Space</kbd> <span data-edit="hint">start / pause</span></div>
    <div id="room" data-figcheck="ignore">
      <div id="roomhead"><span data-edit="room.head">The room</span><span id="roomnote" data-no-edit></span></div>
      <div id="roomdata">
        <div id="roombar"><i class="lost"></i><i class="working"></i><i class="finished"></i></div>
        <div id="legend">
          <div class="lg lost"><b id="nlost" data-no-edit>0</b><span data-edit="room.lost">Lost</span></div>
          <div class="lg working"><b id="nworking" data-no-edit>0</b><span data-edit="room.working">Working on it</span></div>
          <div class="lg finished"><b id="nfinished" data-no-edit>0</b><span data-edit="room.finished">Finished</span></div>
        </div>
      </div>
      <div id="withheld" data-edit="room.withheld" hidden>Enter the lecturer key in the deck to see the room</div>
      <div id="help"><span data-edit="room.help">Stuck? Ask the AI helper on your phone</span><span id="join" data-no-edit hidden></span></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════ CONTENT ═══════════════════════════ */
const CONFIG = /*CONFIG*/{
  "id": "skill",
  "heading": "Lab 1",
  "title": "Make a skill",
  "minutes": 20,
  "do": "Make the skill you just named.",
  "types": [
    ["1 · Tell it the steps", "Write me a skill called [name].\nSteps:\n1 [...]\n2 [...]\n3 [...]"],
    ["2 · Do the task once, then", "Save what we just did as a skill called [name]."],
    ["3 · Adapt an existing one", "Check this skill in [website]. Adapt it."]
  ],
  "tip": "Then test it: run your skill on a new input.",
  "context": "Goal: every student saves one working skill in their project folder and runs it once on a new input. Success: the tool finds the skill by its name and follows its steps. Students use an AI coding tool in their own folder. Common problems: the skill was saved outside the project (ask the tool where it saved it and move it); the tool does not pick the skill up (start a new session and call it by name)."
}/*END*/;

/* ---- editable text (the deck's EMBED_TEXT_BRIDGE) -------------------------------
   CONFIG holds the defaults; the deck's overrides (the embed's `texts`, reworded
   by double-click on the edit canvas) win, and reach the phone page too (same
   keys in lab-phone.html). KEY is the CONFIG field: do, tip, types.N.0 (a prompt
   box's label), types.N.1 (the prompt itself). The fixed words around the timer
   and the room are data-edit in the markup: hint, room.head, room.lost,
   room.working, room.finished (the phone's three buttons read the same three),
   room.withheld, room.help. The clock, the controls, the counts and the
   address are live values (data-no-edit). A prompt's span holds the raw
   string; its [..] placeholders are <b> inside it, so its textContent is still
   the field. After an edit the bridge calls TESSERA_REFIT, which redraws the card
   from TX (and so brings the placeholder highlights back). */
const TX = (k, d) => { const E = window.TESSERA_EMBED; return E && typeof E.text === 'function' ? E.text(k, d == null ? '' : d) : (d == null ? '' : d); };

/* ═══════════════════════════ CARD ══════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
if (CONFIG.heading || CONFIG.title) document.title = [TX('heading', CONFIG.heading), TX('title', CONFIG.title)].filter(Boolean).join(': ');
function cardHTML(c) {
  const types = (c.types || []).slice(0, 3);
  const doT = TX('do', c.do), tip = TX('tip', c.tip);
  let h = '';
  if (doT) h += `<div class="do" data-edit="do">${esc(doT)}</div>`;
  const steps = (c.steps || []).slice(0, 5);
  if (steps.length) h += `<ol class="steps">` + steps.map((s, k) => `<li><span data-edit="steps.${k}">${esc(TX('steps.' + k, s))}</span></li>`).join('') + `</ol>`;
  if (types.length) h += `<div class="types${types.length === 1 ? ' one' : types.length === 3 ? ' three' : ''}">` +
    types.map((t, k) => `<div class="type"><i data-edit="types.${k}.0">${esc(TX('types.' + k + '.0', t[0]))}</i>` +
      `<span data-edit="types.${k}.1">${esc(TX('types.' + k + '.1', t[1])).replace(/[[][^[]*?]/g, m => `<b class="ph">${m}</b>`)}</span></div>`).join('') + `</div>`;
  if (tip) h += `<div class="tip" data-edit="tip">${esc(tip)}</div>`;
  return h;
}
$('inner').innerHTML = cardHTML(CONFIG);
window.TESSERA_REFIT = () => { $('inner').innerHTML = cardHTML(CONFIG); };   // a label reworded on the edit canvas

/* ═══════════════════════════ COUNTDOWN ═════════════════════════ */
const MIN_MIN = 1, MAX_MIN = 60, WARN_SEC = 60, R = 92, CIRC = 2 * Math.PI * R;
const FLOOR_SEC = 30;                 // minus never leaves a running countdown with less than this
const clamp = m => Math.max(MIN_MIN, Math.min(MAX_MIN, Math.round(m)));
let minutes = clamp(+CONFIG.minutes || 10), total = minutes * 60, left = total, running = false, endAt = 0;
$('sweep').style.strokeDasharray = CIRC;
function addMinutes(d) {
  if (left <= 0) {                                   // time is up: plus gives one more minute, and it runs
    if (d > 0) { total = left = 60; running = true; endAt = Date.now() + 60000; }
    paint(); return;
  }
  if (running) left = Math.max(0, (endAt - Date.now()) / 1000);
  const next = clamp(minutes + d);
  const fresh = !running && left === total;          // not started yet: the whole length changes
  if (next === minutes || (!fresh && d < 0 && left < 60 + FLOOR_SEC)) { paint(); return; }   // never (nearly) end it with a key
  const step = (next - minutes) * 60;
  minutes = next; total = minutes * 60;
  left = fresh ? total : left + step;
  if (running) endAt += step * 1000;
  paint();
}
function toggle() {
  if (left <= 0) { reset(); return; }
  running = !running;
  if (running) endAt = Date.now() + left * 1000;
  else left = Math.max(0, (endAt - Date.now()) / 1000);
  paint();
}
/* Start and pause come from three places: Space, the Start button and the dial. A second one right
   after the first is a held key or a double click, not a decision, and is ignored. Space offered by
   the deck arrives without the "repeat" flag, so a held key can only be told by time:
     - after a start or a pause, nothing counts for `wait` ms (longer than the delay before a keyboard
       starts to repeat), whoever has the keyboard, the deck or this page;
     - a press from the deck that follows another one within REPEAT_MS is a repeat of a held key.
   An ignored press does not restart the wait. Space that arrives together with the slide (a long or
   double press on the slide before) is not a decision either: for ARRIVE_MS after the page comes on
   show, Space from the deck is swallowed. */
const TAP_MS = 500, TAP_MS_KEY = 1100, TAP_MS_DECK = 1100, REPEAT_MS = 250, ARRIVE_MS = 1000;
let lastTap = -1e9, lastSeen = -1e9, shownAt = performance.now();
function tap(wait = TAP_MS, fromDeck = false) {
  const now = performance.now();
  const again = now - lastTap < wait || (fromDeck && (now - lastSeen < REPEAT_MS || now - shownAt < ARRIVE_MS));
  if (fromDeck) lastSeen = now;
  if (again) return;
  lastTap = now;
  toggle();
}
function reset() { running = false; total = minutes * 60; left = total; paint(); }
function paint() {
  const shown = Math.max(0, Math.ceil(left - 0.0001));
  $('time').textContent = `${Math.floor(shown / 60)}:${String(shown % 60).padStart(2, '0')}`;
  $('len').textContent = `${minutes} min`;
  const over = left <= 0;
  const frac = over ? 1 : (total > 0 ? Math.max(0, Math.min(1, left / total)) : 0);
  $('sweep').style.strokeDashoffset = CIRC * (1 - frac);
  document.body.classList.toggle('warn', !over && left <= WARN_SEC);
  document.body.classList.toggle('over', over);
  $('state').textContent = over ? "Time's up" : running ? 'Running' : (left === total ? 'Ready' : 'Paused');
  $('go').textContent = over ? 'Again' : running ? 'Pause' : (left === total ? 'Start' : 'Resume');
  const fresh = !running && left === total;
  $('minus').disabled = over || minutes <= MIN_MIN || (!fresh && left < 60 + FLOOR_SEC);
  $('plus').disabled = !over && minutes >= MAX_MIN;          // at "Time's up" plus always gives one more minute
}

/* ═══════════════════════════ THE ROOM ══════════════════════════ */
/* The lecturer key goes as x-tessera-lecturer. A poll service from before the rename lists
   only its old header name in CORS, so its preflight fails: a request carrying the key that
   fails on the network is sent once more under that name. */
const OLD_LECTURER_HEADER = 'x-bento-lecturer'; // decks written before the rename / the old service only allow this name
async function lfetch(url, opts = {}) {
  try { return await fetch(url, opts); }
  catch (err) {
    const h = Object.assign({}, opts.headers || {});
    if (!h['x-tessera-lecturer'] || (err && err.name === 'AbortError')) throw err;
    h[OLD_LECTURER_HEADER] = h['x-tessera-lecturer']; delete h['x-tessera-lecturer'];
    return fetch(url, Object.assign({}, opts, { headers: h }));
  }
}
const EMB = (window.TESSERA_EMBED && window.TESSERA_EMBED.poll) || null;
const PREV = EMB && EMB.previous;
// only the lab's own check-in: any other poll before this slide belongs to an earlier slide
const CODE = (PREV && /^Lab check-in/.test(PREV.question || '') && PREV.code) || '';
const SERVICE = String((EMB && EMB.service) || '').replace(/\/+$/, '');
const KEY = (EMB && EMB.lecturer) || '';
const LIVE = !!(EMB && SERVICE && CODE);
const STATES = ['lost', 'working', 'finished'];
const SAMPLE = { lost: 3, working: 18, finished: 7 };

// the address a phone that lost the page types: <host>/<session>
(function join() {
  const host = SERVICE.replace(/^https?:\/\//, '').replace(/^www\./, '');
  const s = (EMB && (EMB.session || (CODE && PREV.join))) || '';
  if (!host || !s) return;
  const el = $('join');
  el.textContent = `${host}/${s}`;
  el.hidden = false;
})();
// a long address shrinks until it fits the column (never under 14 px)
function fitJoin() {
  const el = $('join');
  if (el.hidden || !el.offsetWidth) return;
  const room = $('help').clientWidth;
  for (let px = 18; px >= 14; px--) { el.style.fontSize = px + 'px'; if (el.scrollWidth <= room) return; }
  el.style.whiteSpace = 'normal'; el.style.wordBreak = 'break-all';
}

// the latest answer per pid; text that does not parse or has no valid st is skipped
function countRoom(answers) {
  const last = new Map();
  for (const a of answers || []) {
    let o;
    try { o = JSON.parse(a.text); } catch (e) { continue; }
    if (!o || typeof o !== 'object' || !o.pid || STATES.indexOf(o.st) < 0) continue;
    last.delete(o.pid); last.set(String(o.pid), o.st);
  }
  const n = { lost: 0, working: 0, finished: 0 };
  last.forEach(st => { n[st]++; });
  return n;
}
function drawRoom(n, note, tag) {
  const all = n.lost + n.working + n.finished;
  const bar = $('roombar').children;
  STATES.forEach((st, k) => {
    $('n' + st).textContent = n[st];
    bar[k].style.width = all ? (100 * n[st] / all) + '%' : '0';
  });
  const el = $('roomnote');
  el.textContent = note;
  el.className = tag ? 'tag' : '';
}
function setMode(withheld) {
  $('roomdata').hidden = withheld;
  $('withheld').hidden = !withheld;
  if (withheld) { $('roomnote').textContent = ''; $('roomnote').className = ''; }
}

let busy = false;
async function pull() {
  if (busy || document.visibilityState !== 'visible') return;
  busy = true;
  const ctl = window.AbortController ? new AbortController() : null;
  const stop = ctl ? setTimeout(() => ctl.abort(), 9000) : 0;
  try {
    const r = await lfetch(`${SERVICE}/api/poll?c=${encodeURIComponent(CODE)}`, {
      cache: 'no-store', signal: ctl ? ctl.signal : undefined,
      headers: KEY ? { 'x-tessera-lecturer': KEY } : {} });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    $('room').classList.remove('stale');
    if (d.answersWithheld) { setMode(true); return; }
    setMode(false);
    const n = countRoom(d.answers);
    const all = n.lost + n.working + n.finished;
    drawRoom(n, all === 1 ? '1 phone' : `${all} phones`, false);
  } catch (e) {
    $('room').classList.add('stale');          // keep the last numbers, dimmed; say nothing
  } finally {
    clearTimeout(stop);
    busy = false;
  }
}

/* ═══════════════════════════ SIZE ══════════════════════════════ */
/* The frame can be 0 x 0 while the script runs (a slideshow restarted on this slide), and no
   resize event follows. So the size is read on every frame and on a timer, never only once. */
let fitW = 0, fitH = 0;
function fit() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h || (w === fitW && h === fitH)) return;
  fitW = w; fitH = h;
  $('stage').style.transform = `translate(-50%,-50%) scale(${Math.min(w / 1280, h / 500)})`;
  fitJoin();
}
addEventListener('resize', fit); addEventListener('load', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
setInterval(fit, 1000);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitJoin);

let lastT = 0;
function frame(t) {
  // no frames while the slide was not on show: it has just come back. The very first frame counts too.
  if (!lastT || t - lastT > 400) shownAt = performance.now();
  lastT = t;
  fit();
  if (running) {
    left = Math.max(0, (endAt - Date.now()) / 1000);
    if (left <= 0) running = false;
    paint();
  }
  requestAnimationFrame(frame);
}

/* ═══════════════════════════ INPUT ═════════════════════════════ */
/* A button never takes the keyboard: the deck does not pass on keys that land on a button, so a
   button with the keyboard would trap the arrow keys and a clicker. */
const press = (id, fn) => {
  $(id).addEventListener('mousedown', e => e.preventDefault());
  $(id).addEventListener('click', e => { fn(); e.currentTarget.blur(); });
};
press('minus', () => addMinutes(-1));
press('plus', () => addMinutes(1));
press('go', () => tap());
$('dial').addEventListener('click', () => tap());

/* The deck offers Space, the arrows and the Page keys to this page first (TESSERA_STEPPED). Only Space
   is kept. + / - / R arrive only once the frame has the keyboard. Any other key belongs to the deck. */
window.TESSERA_STEPPED = true;
const LEAVE = { ArrowRight: 1, ArrowLeft: 1, PageDown: 1, PageUp: 1 };   // the deck's bridge passes these on itself
const QUIET = { Shift: 1, Control: 1, Alt: 1, Meta: 1, CapsLock: 1, Dead: 1, Unidentified: 1 };
const handBack = () => { try { if (parent !== window) parent.focus(); } catch (e) {} };
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, code = e.code || '';
  if (k === 'Tab') { e.preventDefault(); handBack(); return; }
  // plus and minus are told by their character (on a French keyboard the minus sits on the 6 key)
  const plus = k === '+' || k === '=' || code === 'NumpadAdd';
  const minus = k === '-' || code === 'NumpadSubtract';
  let used = true;
  if (k === ' ' || k === 'Spacebar') { if (!e.repeat) tap(e.isTrusted ? TAP_MS_KEY : TAP_MS_DECK, !e.isTrusted); }
  else if (plus) addMinutes(1);
  else if (minus) addMinutes(-1);
  else if (k === 'r' || k === 'R') { if (!e.repeat) reset(); }
  else used = false;
  if (used) e.preventDefault();
  else if (!LEAVE[k] && !QUIET[k]) handBack();
});

// for checks only
window.LABCARD = {
  state: () => ({ running, left: Math.ceil(left), minutes, live: LIVE, code: CODE,
                  room: { lost: +$('nlost').textContent, working: +$('nworking').textContent, finished: +$('nfinished').textContent },
                  withheld: !$('withheld').hidden, stale: $('room').classList.contains('stale'),
                  scale: fitW ? Math.min(fitW / 1280, fitH / 500) : 0 }),
  toggle, reset, pull, countRoom,
  setLeft: sec => { left = sec; if (running) endAt = Date.now() + sec * 1000; paint(); },   // jump the countdown
};

paint(); fit(); requestAnimationFrame(frame);
// a frozen student copy (publish.py students): no room, no helper, no requests
if (document.documentElement.hasAttribute('data-offline')) {
  $('room').style.visibility = 'hidden';
} else if (LIVE) {
  drawRoom({ lost: 0, working: 0, finished: 0 }, '', false);
  pull();
  setInterval(() => { if (!document.hidden) pull(); }, 4000);   // every read is billed: none while unseen
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
} else {
  // the poster, the editor canvas, or a slide with no lab check-in before it: a sample, said so
  drawRoom({ lost: 0, working: 0, finished: 0 }, 'sample', true);
  setTimeout(() => drawRoom(SAMPLE, 'sample', true), 80);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="tessera-game">
<meta name="tessera-activity" content="full">
<title>Prompt game</title>
<!-- The prompt game, the PHONE half (the activity page; prompt-screen.html is the
     screen, and its top comment is the contract). The join page injects the game
     SDK (<meta name="tessera-game">); the SDK joins with TESSERA_ACTIVITY.name.
     One turn: the student's words (plus the current code) -> g.ai('draw', input)
     -> {text} -> the function draw(ctx, t), run here in a Worker (main-thread
     fallback with a loop guard) -> the move p<n> = {p, js}. The model's brief is
     the "draw" task in the tessera-ai tag below (draw.js's system prompt without
     the planted errors), so a phone cannot rewrite it; the service answers only
     within 3 h of the activity page being published.
     A reload is the same player: the history comes back from g.me.moves.
     The phone sends only while the server's accept takes p*; from the ranking on
     it shows its own place (private {rank, of, score}).
     Opened on its own (no TESSERA_ACTIVITY): sample mode, canned drawings, no network.
     ?main: force the main-thread runner (to test the fallback).
     No storage, no CDN, no fonts (sandboxed, opaque origin). -->
<script type="application/json" id="tessera-ai">{"tasks": {"draw": {"max": 1400, "json": false, "system": "You write one JavaScript function for a classroom exercise. A student describes an animation in words; you draw it. On later turns the student tells you what is wrong or what to change, and you change the code.\n\nReply with the source of one function and nothing else: no markdown fences, no comments, no explanation.\n\nfunction draw(ctx, t) { ... }\n\nRules for the function:\n- ctx is a 2D canvas context of 320 by 180 pixels, already cleared to white before every call.\n- t goes from 0 to 1 over 6 seconds and then starts again, so the animation must loop cleanly.\n- Use only ctx and Math. No DOM, no images, no fonts, no timers, no globals, no state between calls.\n- No loops that could run long. Keep the whole function under 1,700 characters.\n- Follow the student's description as literally as you can. Where they did not say something, choose something simple.\n- If the student reports something that looks wrong, fix exactly that and keep the rest.\n- If the message is not about the drawing, return the current code unchanged."}}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff;color:#1A2326;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:8px 6px 20px;line-height:1.4}
main{max-width:560px;margin:0 auto}
#top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.kick{font-size:12px;font-weight:700;letter-spacing:.1em;color:#0F6B73;text-transform:uppercase}
#who{font-size:13px;color:#5A6467;font-weight:600;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-size:20px;font-weight:800;line-height:1.25;margin:4px 0 10px}
label{display:block;font-size:15px;font-weight:700;margin:12px 0 6px}
input,textarea{display:block;width:100%;font:inherit;font-size:16px;color:#1A2326;border:2px solid #D7DEDF;border-radius:10px;padding:10px;background:#fff}
input:focus,textarea:focus{outline:0;border-color:#0F6B73}
textarea{height:84px;resize:none}
textarea:disabled{background:#F1F5F5}
button{display:block;width:100%;height:52px;margin-top:8px;border:0;border-radius:12px;background:#0F6B73;color:#fff;font:inherit;font-size:17px;font-weight:800}
button:disabled{background:#D7DEDF}
button:active{transform:scale(.98)}
#pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5A6467;margin-bottom:4px}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#fff;border:1px solid #D7DEDF}
#mineBox canvas{border-color:#0F6B73}
#err{display:none;margin-top:10px;padding:10px 12px;background:#FBE8E2;color:#A83A20}
#err.on{display:block}
#errText{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:700;word-break:break-word}
#bar{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:8px;min-height:20px;font-size:14px;color:#5A6467}
#turn{font-weight:700;color:#1A2326;white-space:nowrap}
#status.err{color:#A83A20;font-weight:700}
#status.ok{color:#2B7041;font-weight:700}
#shut{display:none;margin-top:12px;padding:10px 12px;background:#FCF0DA;color:#6E4C00;font-size:15px;font-weight:600}
#shut.on{display:block}
#place{display:none;margin-top:12px;padding:14px;background:#1A2326;color:#fff}
#place.on{display:block}
#place .t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
#place .big{font-size:36px;font-weight:800;line-height:1.1;margin-top:2px}
#place .big small{font-size:18px;font-weight:600;opacity:.8}
#hist{margin-top:16px;display:none}
#hist.on{display:block}
#hist ol{list-style:none}
#hist li{display:flex;gap:8px;padding:7px 0;border-top:1px solid #D7DEDF;font-size:15px;word-break:break-word}
#hist li i{font-style:normal;font-weight:700;color:#0F6B73;flex:0 0 22px}
.v{display:none}.v.on{display:block}
</style></head>
<body><main>
<div id="top"><div class="kick" id="title">Prompt game</div><div id="who"></div></div>

<div class="v" id="gate">
  <h1 id="head1">Recreate the animation by telling an AI what to draw.</h1>
  <label for="name">Your name on the wall</label>
  <input id="name" maxlength="40" placeholder="First name, or a team name" autocomplete="off">
  <button id="start" disabled>Start</button>
  <p id="gerr" style="margin-top:8px;color:#A83A20;font-weight:700;font-size:14px"></p>
</div>

<div class="v" id="gone">
  <h1>You were taken off the wall.</h1>
  <p style="color:#5A6467">If that was a mistake, join again.</p>
  <button id="again">Join again</button>
</div>

<div class="v" id="game">
  <div id="pair">
    <div><div class="cap">Target</div><canvas id="cvT" width="480" height="270"></canvas></div>
    <div id="mineBox"><div class="cap">Your version</div><canvas id="cvM" width="480" height="270"></canvas></div>
  </div>
  <div id="err"><div id="errText"></div></div>
  <div id="bar"><span id="status"></span><span id="turn"></span></div>
  <div id="place"><div class="t">Your place</div><div class="big" id="placeN"></div></div>
  <div id="shut"></div>
  <label for="say" id="ask">Describe it, or say what to change</label>
  <textarea id="say" maxlength="600" placeholder="Shapes, colours, where they are, how they move. Borrow from the prompts on the screen."></textarea>
  <button id="send" disabled>Send</button>
  <div id="hist"><div class="cap">Your prompts</div><ol id="hl"></ol></div>
</div>
</main>

<script>
'use strict';
const CONFIG = Object.assign({
  title: 'Prompt game',
  target: {},
  phoneHead: 'Recreate the animation by telling an AI what to draw.',
  phoneAsk: 'Describe it, or say what to change',
  phoneHint: 'Shapes, colours, where they are, how they move. Borrow from the prompts on the screen.',
  phoneClosed: 'The phones are closed. Watch the screen.',
}, /*CONFIG*/null/*CONFIG*/ || {});
const TEXTS = (window.TESSERA_EMBED && window.TESSERA_EMBED.texts) || {};   // the screen's wording, put here by the deck
const T = (k, d) => (Object.prototype.hasOwnProperty.call(TEXTS, k) ? TEXTS[k] : d);
const HOST = window.TESSERA_ACTIVITY || null;
const FORCE_MAIN = /[?&]main\b/.test(location.search);
const DW = 320, DH = 180, LOOP = 6000, MAXLEN = 3000, MAXTURN = 60;
const STUCK = 'The drawing never finished. It may be stuck in a loop.';
const $ = id => document.getElementById(id);
$('title').textContent = T('title', CONFIG.title);
$('head1').textContent = T('phoneHead', CONFIG.phoneHead);
$('ask').textContent = T('phoneAsk', CONFIG.phoneAsk);
$('say').placeholder = T('phoneHint', CONFIG.phoneHint);

/* ---- the target: art() of prompt-screen.html, the same text. Keep the two in step. */
/* art:begin */
function art(o = {}) {
  const p = Object.assign({ R: 76, pts: 5, skip: 2, dots: 6, adv: .4, turn: 1, hold: 1.6, pulses: 2,
    tri: '#0F6B73', dot: '#1A2326', starc: '#3B9457', ring: '#C7CFD1', ease: true }, o);
  return `function draw(ctx,t){
const N=${p.pts},T=Math.PI*2,R=${p.R},V=[];
for(let i=0,v=0;i<N;i++,v=(v+${p.skip})%N){const a=v*T/N-Math.PI/2;V.push([R*Math.cos(a),R*Math.sin(a)])}
const at=q=>{q=((q%1)+1)%1;const s=Math.floor(q*N),u=q*N-s,e=${p.ease ? '(Math.sin(Math.PI*(u-.5))+1)/2' : 'u'},a=V[s],b=V[(s+1)%N];return[a[0]+e*(b[0]-a[0]),a[1]+e*(b[1]-a[1])]};
ctx.translate(160,90);
ctx.rotate(${p.turn}*t*T/N);
const P=[];for(let i=0;i<${p.dots};i++)P.push(at(i/${p.dots}+${p.adv}*t));
const g=Math.min(1,${p.hold}*Math.pow(Math.max(0,Math.sin(T*${p.pulses}*t)),2));
if(g>0){ctx.globalAlpha=g;ctx.beginPath();ctx.arc(0,0,R,0,T);ctx.fillStyle='${p.starc}';ctx.fill();ctx.globalAlpha=1;
ctx.beginPath();[0,2,4].forEach((i,k)=>ctx[k?'lineTo':'moveTo'](P[i][0],P[i][1]));ctx.fillStyle='#fff';ctx.fill()}
ctx.beginPath();ctx.arc(0,0,R,0,T);ctx.strokeStyle='${p.ring}';ctx.lineWidth=1;ctx.stroke();
ctx.beginPath();for(let i=0;i<3;i++){ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[i+3][0],P[i+3][1])}
ctx.strokeStyle='${p.tri}';ctx.lineWidth=2;ctx.stroke();
if(g>0){ctx.beginPath();for(const i of[0,2,4]){const a=P[i],b=P[(i+2)%6];ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0]+g*(b[0]-a[0]),a[1]+g*(b[1]-a[1]))}
ctx.strokeStyle='${p.starc}';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke()}
ctx.fillStyle='${p.dot}';for(const q of P){ctx.beginPath();ctx.arc(q[0],q[1],3.4,0,T);ctx.fill()}
}`;
}
const TARGET = typeof CONFIG.target === 'string' && /draw/.test(CONFIG.target) ? CONFIG.target
  : art(CONFIG.target && typeof CONFIG.target === 'object' ? CONFIG.target : {});
/* art:end */
const now = () => (Date.now() % LOOP) / LOOP;
function fresh(ctx, c) {
  if (ctx.reset) ctx.reset(); else c.width = c.width;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.scale(c.width / DW, c.height / DH);
}

/* The target is this page's own code (the deck author's), so it runs here. */
const cvT = $('cvT'), ctxT = cvT.getContext('2d');
let drawTarget = null;
try { drawTarget = new Function(TARGET + ';return draw')(); } catch (e) {}
(function loopT() { fresh(ctxT, cvT); try { drawTarget && drawTarget(ctxT, now()); } catch (e) {} requestAnimationFrame(loopT); })();

/* ---- running what the AI wrote ---------------------------------------------
   It is code nobody has read, so it runs in a Worker: it draws on an
   OffscreenCanvas there and hands back one picture per frame. If a frame (or the
   first check of 24 frames) takes too long, the Worker is killed and a new one
   started, so a loop that never ends costs that drawing, not the page.
   Where a Worker cannot be made from a blob URL, or has no OffscreenCanvas, the
   code runs on the page instead, with a counter written into its loops. */
const cvM = $('cvM'), ctxM = cvM.getContext('2d');
function blankMine() { fresh(ctxM, cvM); }
blankMine();

function workerMain() {
  const HIDE = ['self', 'globalThis', 'fetch', 'XMLHttpRequest', 'WebSocket', 'importScripts', 'postMessage',
    'setTimeout', 'setInterval', 'indexedDB', 'caches', 'navigator', 'close'];
  const post = self.postMessage.bind(self);
  let c = null, ctx = null, fn = null;
  function compile(code) {
    const f = new Function(...HIDE, '"use strict";' + code + '\n;return typeof draw==="function"?draw:null')();
    if (!f) throw new Error('no draw function');
    return f;
  }
  function fresh() {
    if (ctx.reset) ctx.reset(); else c.width = c.width;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.scale(c.width / 320, c.height / 180);
  }
  self.onmessage = e => {
    const m = e.data;
    try {
      if (m.init) {
        c = new OffscreenCanvas(m.w, m.h); ctx = c.getContext('2d'); fresh();
        const b = c.transferToImageBitmap(); post({ ready: 1, bmp: b }, [b]); return;
      }
      if ('code' in m) {
        fn = null; const f = compile(m.code);
        for (let k = 0; k < 24; k++) { fresh(); f(ctx, k / 24); }
        fn = f; post({ id: m.id, ok: 1 }); return;
      }
      if ('t' in m) {
        if (!fn) { post({ f: m.f }); return; }
        fresh(); fn(ctx, m.t);
        const b = c.transferToImageBitmap(); post({ f: m.f, bmp: b }, [b]);
      }
    } catch (err) { fn = null; post({ id: m.id, f: m.f, err: String(err) }); }
  };
}

/* Main-thread fallback: `while (c)` becomes `while (__g() && (c))`, and the same
   for the test of a classic `for`. __g throws once a frame has gone on too long. */
function guard(src) {
  let out = '', i = 0; const n = src.length;
  const skip = j => {                       // j at a quote, a // or a /*: the index after it
    const q = src[j];
    if (q === '/') { if (src[j + 1] === '/') { const k = src.indexOf('\n', j); return k < 0 ? n : k; }
      const k = src.indexOf('*/', j + 2); return k < 0 ? n : k + 2; }
    let k = j + 1; while (k < n && src[k] !== q) { if (src[k] === '\\') k++; k++; } return k + 1;
  };
  const opens = j => src[j] === '"' || src[j] === "'" || src[j] === '`' ||
    (src[j] === '/' && (src[j + 1] === '/' || src[j + 1] === '*'));
  while (i < n) {
    if (opens(i)) { const j = skip(i); out += src.slice(i, j); i = j; continue; }
    const m = /^(while|for)\s*\(/.exec(src.slice(i, i + 16));
    if (m && !/[\w$.]/.test(src[i - 1] || ' ')) {
      const a = i + m[0].length; let j = a, d = 1; const semi = [];
      while (j < n && d) {
        if (opens(j)) { j = skip(j); continue; }
        const ch = src[j];
        if (ch === '(' || ch === '[' || ch === '{') d++;
        else if (ch === ')' || ch === ']' || ch === '}') d--;
        else if (ch === ';' && d === 1) semi.push(j);
        j++;
      }
      if (m[1] === 'while') out += 'while(__g()&&(' + src.slice(a, j - 1) + '))';
      else if (semi.length === 2) out += 'for(' + src.slice(a, semi[0]) + ';__g()&&(' +
        (src.slice(semi[0] + 1, semi[1]).trim() || '1') + ');' + src.slice(semi[1] + 1, j - 1) + ')';
      else out += src.slice(i, j);
      i = j; continue;
    }
    out += src[i++];
  }
  return out;
}

const said = e => e && e.message === STUCK ? STUCK : String(e);
const run = {
  mode: '', w: null, ready: null, loaded: false, wait: null, sent: 0, frameN: 0, loadN: 0, fn: null,
  onBroken: null,                              // a drawing that ran at first and then failed
  boot() {
    if (FORCE_MAIN || typeof Worker === 'undefined' || typeof Blob === 'undefined') { this.mode = 'main'; this.ready = Promise.resolve(); return; }
    this.ready = new Promise(done => {
      let settled = false;
      const fall = () => { if (settled) return; settled = true; try { this.w && this.w.terminate(); } catch (e) {} this.w = null; this.mode = 'main'; done(); };
      try {
        this.spawn(m => {
          if (settled) return;
          if (m.ready) { settled = true; this.mode = 'worker'; done(); } else fall();
        }, fall);
        setTimeout(fall, 2500);
      } catch (e) { fall(); }
    });
  },
  spawn(first, fail) {
    const url = URL.createObjectURL(new Blob(['(' + workerMain.toString() + ')()'], { type: 'text/javascript' }));
    const w = this.w = new Worker(url);
    w.onerror = () => { if (fail) fail(); };
    w.onmessage = e => { const m = e.data; if (first) { const f = first; first = null; if (m.bmp) m.bmp.close(); f(m); return; } this.got(m); };
    w.postMessage({ init: 1, w: cvM.width, h: cvM.height });
  },
  restart() { try { this.w.terminate(); } catch (e) {} this.loaded = false; this.sent = 0; this.spawn(() => {}, null); },
  got(m) {
    if (m.id && this.wait && m.id === this.wait.id) {
      clearTimeout(this.wait.timer); const done = this.wait.done; this.wait = null;
      this.loaded = !m.err; done(m.err ? { err: m.err } : { ok: true }); return;
    }
    if (m.f && m.f === this.frameN) {
      this.sent = 0;
      if (m.err) { this.loaded = false; this.onBroken && this.onBroken(m.err); }
      else if (m.bmp && this.loaded) { ctxM.setTransform(1, 0, 0, 1, 0, 0); ctxM.drawImage(m.bmp, 0, 0); }
    }
    if (m.bmp) m.bmp.close();
  },
  /* Resolves {ok:true} when the code compiled and drew 24 frames, else {err}. */
  async load(code) {
    await this.ready;
    this.loaded = false; this.fn = null;
    if (this.mode === 'worker') return new Promise(done => {
      const id = ++this.loadN;
      this.wait = { id, done, timer: setTimeout(() => { this.wait = null; this.restart(); done({ err: STUCK }); }, 2500) };
      this.sent = 0; this.w.postMessage({ id, code });
    });
    try {
      const f = this.compileMain(code);
      for (let k = 0; k < 24; k++) this.paintMain(f, k / 24);
      this.fn = f; this.loaded = true; return { ok: true };
    } catch (e) { blankMine(); return { err: said(e) }; }
  },
  compileMain(code) {
    const HIDE = ['window', 'self', 'globalThis', 'document', 'parent', 'top', 'frames', 'location', 'navigator', 'fetch',
      'XMLHttpRequest', 'WebSocket', 'postMessage', 'setTimeout', 'setInterval', 'requestAnimationFrame', 'alert', 'open', 'close',
      'TesseraGame', 'TESSERA_ACTIVITY', 'TESSERA_EMBED'];
    const tail = '\n;return typeof draw==="function"?draw:null';
    const mk = s => new Function('__g', ...HIDE, '"use strict";' + s + tail);
    mk(code);                                  // the AI's own syntax errors, in its own words
    let make; try { make = mk(guard(code)); } catch (e) { make = mk(code); }
    const f = make(() => {
      if (++this.gn > 2e6 || ((this.gn & 1023) === 0 && Date.now() - this.gt > 400)) throw new Error(STUCK);
      return true;
    });
    if (!f) throw new Error('no draw function');
    return f;
  },
  paintMain(f, t) { this.gn = 0; this.gt = Date.now(); fresh(ctxM, cvM); f(ctxM, t); },
  frame() {
    if (!this.loaded) return;
    if (this.mode === 'worker') {
      if (this.sent) {
        if (Date.now() - this.sent > 2000) { this.restart(); this.onBroken && this.onBroken(STUCK); }
        return;
      }
      this.sent = Date.now(); this.w.postMessage({ f: ++this.frameN, t: now() });
    } else if (this.fn) {
      try { this.paintMain(this.fn, now()); }
      catch (e) { this.loaded = false; this.onBroken && this.onBroken(said(e)); }
    }
  }
};
run.boot();
(function loopM() { run.frame(); requestAnimationFrame(loopM); })();

/* ---- the conversation ------------------------------------------------------ */
let g = null, busy = false, prev = '', shown = '', seen = '';
let turns = [];                              // [{n, p, js}] in turn order: the server's, plus a refused one at the end
function clean(s) {
  return String(s || '').replace(/^\s*```[a-z]*\s*$/gim, '').replace(/^\s*export\s+(default\s+)?/gm, '').trim();
}
/* The model's reply -> the function (draw.js parse(), without the verdict line). */
function parse(text) {
  let s = String(text || '').trim();
  const fence = s.match(/```(?:js|javascript)?\s*([\s\S]*?)```/i);
  if (fence) s = fence[1].trim();
  const at = s.search(/function\s+draw\s*\(/);
  if (at >= 0) return clean(s.slice(at));
  return /\bdraw\s*=/.test(s) ? clean(s) : '';
}
function input(prompt) {
  const p = prev && prev.length <= MAXLEN ? prev : '';
  return p ? `The current code:\n\n${p}\n\nThe student now says:\n\n${prompt}` : `The student describes the animation:\n\n${prompt}`;
}
function status(text, cls) { $('status').textContent = text; $('status').className = cls || ''; }
function showErr(text) { $('errText').textContent = text; $('err').classList.toggle('on', !!text); if (text) blankMine(); }
run.onBroken = msg => showErr(msg);
const nextN = () => turns.reduce((m, t) => Math.max(m, t.saved ? t.n : 0), 0) + 1;
function canPlay() {
  const a = g && g.accept;
  if (!a || !Array.isArray(a.moves)) return true;
  return a.moves.some(k => k === 'p*' || k === '*' || /^p\d+$/.test(k));
}
function paintHist() {
  const ol = $('hl'); ol.textContent = '';
  for (const t of turns.slice().reverse()) {
    const li = document.createElement('li'); li.innerHTML = '<i></i><span></span>';
    li.firstChild.textContent = t.saved ? t.n : '–'; li.lastChild.textContent = t.p;
    ol.append(li);
  }
  $('hist').classList.toggle('on', turns.length > 0);
}
async function showCode(js) {
  if (js === shown) return;
  shown = js; showErr('');
  if (!js) { blankMine(); return; }
  const res = await run.load(js);
  if (res.err && shown === js) showErr(res.err);
}
/* The server's history (g.me.moves) is the truth: a reload or a reset rebuilds from it. */
function fromMe(me) {
  const mv = (me && me.moves) || {}, list = [];
  for (const k in mv) { const m = /^p(\d{1,3})$/.exec(k); if (m) list.push({ n: +m[1], p: String((mv[k].data || {}).p || ''), js: String((mv[k].data || {}).js || ''), saved: true }); }
  list.sort((a, b) => a.n - b.n);
  const sig = list.map(t => t.n + ':' + t.p.length + ':' + t.js.length).join(',');
  if (sig === seen || busy) return;
  seen = sig;
  turns = list;
  const last = list.slice().reverse().find(t => t.js);
  prev = last ? last.js : '';
  paintHist(); showCode(prev);
  if (!list.length) status('');
}
async function ask(prompt, n) {
  if (g.sample) { await new Promise(r => setTimeout(r, 500)); return canned(n); }
  let timer;
  const late = new Promise((_, no) => { timer = setTimeout(() => no(new Error('The AI took too long')), 60000); });
  try {
    const r = await Promise.race([g.ai('draw', input(prompt)), late]);
    return parse(r && r.text);
  } finally { clearTimeout(timer); }
}
function aiError(e) {
  if (e && e.closed) return 'The AI is not open: it answers while the slide is on screen. Ask the lecturer.';
  if (e && e.status === 429) return 'The AI has drawn enough for today. Ask the lecturer.';
  return 'No answer: ' + (e && e.message || e) + '. Send again.';
}
async function send() {
  const prompt = $('say').value.trim();
  if (busy || !prompt || !g) return;
  if (!canPlay()) { status(T('phoneClosed', CONFIG.phoneClosed), 'err'); sync(); return; }
  const n = nextN();
  if (n > MAXTURN) { status('That is enough turns for this game.', 'err'); return; }
  busy = true; sync(); status('');
  let js;
  try { js = await ask(prompt, n); }
  catch (e) { busy = false; sync(); status(aiError(e), 'err'); return; }
  if (!js) { busy = false; sync(); status('The AI sent back no drawing. Send again.', 'err'); return; }
  $('say').value = '';
  const fits = JSON.stringify({ p: prompt, js }).length < 3990 && js.length <= MAXLEN;
  const t = { n, p: prompt, js: fits ? js : '', saved: false };
  turns = turns.filter(x => x.saved).concat(t);
  prev = js; paintHist(); await showCode(js);
  try {
    await g.move('p' + n, { p: prompt, js: t.js });
    t.saved = true; paintHist();
    status(fits ? 'On the wall: version ' + n : 'Version ' + n + ' is too long for the wall. Ask for a shorter one.', fits ? 'ok' : 'err');
  } catch (e) {
    status(e.closed ? 'The phones are closed: this version stays on your phone.' : e.kicked ? 'You were taken off the wall.'
      : 'Version ' + n + ' did not reach the wall: ' + e.message, 'err');
  }
  busy = false; sync();
  fromMe(g.me);
}

/* Sample mode (no join page): canned answers that get closer to the target turn by turn. */
function canned(n) {
  if (n === 1) return art({ turn: -1, adv: -.4, starc: '#D2553A', tri: '#BF831A' });
  if (n === 2) return art({ turn: -1, starc: '#D2553A' });
  if (n === 3) return art({ ease: false, R: 64 });
  return n === 4 ? art({ hold: 1 }) : TARGET;
}

/* ---- the views ------------------------------------------------------------- */
function view(id) { for (const v of ['gate', 'gone', 'game']) $(v).classList.toggle('on', v === id); }
function sync() {
  const me = g && g.me, s = (g && g.state) || {};
  $('who').textContent = me && me.joined ? me.name || '' : '';
  if (!g) return;
  if (me && me.kicked) view('gone');
  else if (me && me.joined) view('game');
  else view(g.sample || (HOST && HOST.name) ? 'game' : 'gate');
  const open = canPlay();
  $('shut').textContent = T('phoneClosed', CONFIG.phoneClosed);
  $('shut').classList.toggle('on', !open);
  $('say').disabled = !open;
  $('turn').textContent = 'Turn ' + nextN();
  $('send').disabled = busy || !open || !$('say').value.trim();
  $('send').textContent = busy ? 'The AI is drawing' : 'Send';
  const pv = me && me.private, ranking = s.ph === 'rank' || s.ph === 'podium';
  $('place').classList.toggle('on', !!(ranking && pv && pv.rank));
  if (pv && pv.rank) $('placeN').innerHTML = '#' + (pv.rank | 0) + ' <small>of ' + (pv.of | 0) + ' · ' + (pv.score | 0) + ' points</small>';
}
$('send').addEventListener('click', send);
$('say').addEventListener('input', sync);
function joinAs(n) {
  n = String(n || '').trim().slice(0, 40); if (!n || !g) return;
  $('start').disabled = true;
  g.join(n).then(sync, e => { $('start').disabled = false; $('gerr').textContent = e.closed ? 'Joining is closed.' : e.message; });
}
$('name').addEventListener('input', () => { $('start').disabled = !$('name').value.trim(); });
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') joinAs($('name').value); });
$('start').addEventListener('click', () => joinAs($('name').value));
$('again').addEventListener('click', () => g && g.join().then(sync).catch(e => status(e.message, 'err')));

if (!window.TesseraGame) {
  view('gate'); $('start').disabled = true;
  $('gerr').textContent = 'This page runs inside the join page (the game SDK is not loaded).';
} else {
  g = TesseraGame.connect({ role: 'phone' });
  if (g.sample) g.join('Sample player').catch(() => {});
  g.onMe(me => { fromMe(me); sync(); });
  g.onState(sync);
  setInterval(sync, 1000);
  sync();
}
</script>

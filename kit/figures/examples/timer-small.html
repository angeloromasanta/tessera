<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="figcheck-allow" content="state0 coverage">
<title>Countdown (strip)</title>
<!--
  A compact light countdown strip that sits BELOW a white slide's bullets,
  e.g. an embed at x=56 y=520 w=560 h=112. Drawn on a 560 x 112 stage; it
  scales itself to whatever box it lands in, keeping its proportions.

    [ ring + play/pause ]  12:34  Running        [-] 15 min [+]  [reset]

  On stage:
    - click the ring or the time (or Space) to start / pause
    - the - / + chips, or Up / Down, change the length by one minute
    - R (or the reset chip) resets
  Last minute: ring and time turn coral. Time's up: the ring fills coral and
  pulses. No sound. To change the length the slide opens at, edit DEFAULT_MIN.

  Sandbox rules it obeys: one file, no CDN, no storage (the frame runs at an
  opaque origin, so localStorage throws). A reload starts over at the default.
  Siblings: timer.html (dark full-bleed), timer-half.html (half a slide).
-->
<style>
  @font-face{font-family:Manrope;font-weight:200 800;src:url(MANROPE) format('woff2')}
  :root{
    --ink:#1A2326;      /* all dark text */
    --accent:#0F6B73;   /* the play glyph, hover */
    --muted:#5A6467;    /* state label */
    --rule:#E1E6E7;     /* hairlines, the unfilled ring */
    --tint:#F1F5F5;     /* strip + chip fill */
    --green:#3B9457;    /* the running ring */
    --coral:#D2553A;    /* last minute + time's up */
    --coral-text:#A83A20;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #FFFFFF; color: var(--ink);
    font: 16px/1.4 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; user-select: none;
  }

  /* One 560x112 stage, scaled to the frame. Everything inside is in stage px. */
  #stage {
    position: relative; width: 560px; height: 112px; flex: none;
    transform-origin: center center;
    display: flex; align-items: center; gap: 18px;
    padding: 0 18px 0 12px;
    background: var(--tint); border-radius: 20px;
  }

  /* ── ring with play / pause inside ── */
  #dial { position: relative; width: 84px; height: 84px; flex: none; cursor: pointer; }
  #dial svg.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: #FFFFFF; stroke: var(--rule); stroke-width: 7; }
  .sweep {
    fill: none; stroke: var(--green); stroke-width: 7; stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke .4s ease;
  }
  #glyph { position: absolute; inset: 0; margin: auto; width: 30px; height: 30px; fill: var(--accent); }
  body.warn .sweep, body.over .sweep { stroke: var(--coral); }
  body.over #glyph { fill: var(--coral); }
  body.over #dial { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.1) } }

  /* ── readout ── */
  #readout { flex: 1; min-width: 0; cursor: pointer; }
  #time {
    font-size: 48px; font-weight: 800; letter-spacing: -1.5px;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  #state { margin-top: 4px; font-size: 16px; font-weight: 700; color: var(--muted); }
  body.warn #time, body.over #time { color: var(--coral); }
  body.over #state { color: var(--coral-text); }

  /* ── controls ── */
  .row { display: flex; align-items: center; gap: 8px; flex: none; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
    background: #FFFFFF; border: 1.5px solid var(--rule);
    border-radius: 999px; width: 44px; height: 44px; padding: 0;
    font-size: 22px; line-height: 1;
    display: grid; place-items: center;
    transition: border-color .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  #reset svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  #len { min-width: 66px; text-align: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #reset { margin-left: 6px; }
</style>
</head>
<body>

<div id="stage">
  <div id="dial" title="Click to start / pause (Space)">
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="44"></circle>
      <circle class="sweep" id="sweep" cx="50" cy="50" r="44"></circle>
    </svg>
    <svg id="glyph" viewBox="0 0 30 30" aria-hidden="true"><path id="glyph-path" d="M10 5 L26 15 L10 25 Z"></path></svg>
  </div>

  <div id="readout" title="Click to start / pause (Space)">
    <div id="time" data-no-edit>15:00</div>
    <div id="state" data-no-edit>Ready · click to start</div>
  </div>

  <div class="row">
    <button id="minus" data-no-edit title="One minute less (Down)">&minus;</button>
    <div id="len" data-no-edit>15 min</div>
    <button id="plus" data-no-edit title="One minute more (Up)">+</button>
    <button id="reset" title="Reset (R)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"></path><path d="M4 3.5v5h5"></path></svg></button>
  </div>
</div>

<script>
/* ═════════════════════════════ CONFIG ═════════════════════════════ */

const DEFAULT_MIN = 15;      // what the slide opens at
const MIN_MIN     = 1;       // the adjustable floor
const MAX_MIN     = 60;      // and ceiling
const WARN_SEC    = 60;      // the last stretch turns coral
const STAGE_W = 560, STAGE_H = 112;

/* ═════════════════════════════ ENGINE ═════════════════════════════ */

const $ = (id) => document.getElementById(id);
// Editable words (assets/figure.html): fixed labels carry data-edit=KEY; words
// the script writes per state read through T(KEY, default), so a deck can
// reword them. The clock digits, the minute readout and the -/+ glyphs are
// not labels (data-no-edit).
const T = (k, d) => (window.TESSERA_EMBED && TESSERA_EMBED.text) ? TESSERA_EMBED.text(k, d) : d;
const R = 44, CIRC = 2 * Math.PI * R;
const PLAY = "M10 5 L26 15 L10 25 Z", PAUSE = "M7 5 h6 v20 h-6 Z M17 5 h6 v20 h-6 Z";

let minutes = clamp(DEFAULT_MIN);
let total   = minutes * 60;   // the length the sweep is drawn against
let left    = total;          // seconds remaining
let running = false;
let endAt   = 0;              // wall-clock ms the run ends at
let raf     = 0;

$("sweep").style.strokeDasharray = CIRC;
$("minus").addEventListener("click", () => setMinutes(minutes - 1));
$("plus").addEventListener("click",  () => setMinutes(minutes + 1));
$("dial").addEventListener("click", toggle);
$("readout").addEventListener("click", toggle);
$("reset").addEventListener("click", reset);

document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowUp")    { e.preventDefault(); setMinutes(minutes + 1); }
  else if (e.key === "ArrowDown")  { e.preventDefault(); setMinutes(minutes - 1); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); reset(); }
});

/* keep the stage filling whatever box the slide gives it */
const fit = () => {
  if (!window.innerWidth || !window.innerHeight) return;
const s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  $("stage").style.transform = `scale(${s})`;
};
window.addEventListener("resize", fit);
fit();
/* A frame can run this before it has a size (a slideshow started on this slide):
   never scale to 0, and fit again once the frame is laid out. */
window.addEventListener("load", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
setInterval(fit, 1000);


function clamp(m) { return Math.max(MIN_MIN, Math.min(MAX_MIN, Math.round(m))); }

function setMinutes(m) {
  const next = clamp(m);
  if (next === minutes) { paint(); return; }
  if (running) {
    // adjusting mid-run moves the finish line, it does not restart the clock
    endAt += (next - minutes) * 60000;
    left = Math.max(0, (endAt - Date.now()) / 1000);
  } else if (left === total || left <= 0) {
    left = next * 60;                          // fresh or finished: start over
  } else {
    left = Math.max(1, left + (next - minutes) * 60);   // paused: shift it
  }
  minutes = next;
  total = minutes * 60;
  paint();
}

function toggle() {
  if (left <= 0) { reset(); return; }
  running = !running;
  if (running) { endAt = Date.now() + left * 1000; tick(); }
  else { cancelAnimationFrame(raf); left = Math.max(0, (endAt - Date.now()) / 1000); }
  paint();
}

function reset() {
  running = false;
  cancelAnimationFrame(raf);
  total = minutes * 60;
  left = total;
  paint();
}

function tick() {
  left = Math.max(0, (endAt - Date.now()) / 1000);
  paint();
  if (left <= 0) { running = false; paint(); return; }
  raf = requestAnimationFrame(tick);
}

function paint() {
  const shown = Math.max(0, Math.ceil(left - 0.0001));
  const mm = Math.floor(shown / 60), ss = shown % 60;
  $("time").textContent = `${mm}:${String(ss).padStart(2, "0")}`;
  $("len").textContent = `${minutes} min`;

  const over = left <= 0;
  const frac = over ? 1 : (total > 0 ? Math.max(0, Math.min(1, left / total)) : 0);
  $("sweep").style.strokeDashoffset = CIRC * (1 - frac);

  document.body.classList.toggle("warn", !over && left <= WARN_SEC);
  document.body.classList.toggle("over", over);

  $("state").textContent = over ? T("state-time", "Time's up") : running ? T("state-running", "Running")
                         : (left === total ? T("state-ready", "Ready · click to start") : T("state-paused", "Paused"));
  $("glyph-path").setAttribute("d", running ? PAUSE : PLAY);
  $("minus").disabled = minutes <= MIN_MIN;
  $("plus").disabled  = minutes >= MAX_MIN;
}

paint();
</script>
</body>
</html>

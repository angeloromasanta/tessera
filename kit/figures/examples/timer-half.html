<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="figcheck-allow" content="state0 coverage">
<title>Countdown (half slide)</title>
<!--
  A light countdown for the RIGHT HALF of a white content slide: the bullets
  stay on the left (co-body x=56 w~600), this embed sits at about
  x=680 y=190 w=504 h=420. Drawn on a 504 x 420 stage; it scales itself to
  whatever box it lands in, keeping its proportions.

  On stage:
    - click the dial (or Start, or Space) to start / pause
    - the - / + chips, or Up / Down, change the length by one minute
    - R (or Reset) resets
  Last minute: the ring and the time turn coral. Time's up: the ring fills
  coral and the dial pulses. No sound (see timer.html for the chime).
  To change the length the slide opens at, edit DEFAULT_MIN below.

  Sandbox rules it obeys: one file, no CDN, no storage (the frame runs at an
  opaque origin, so localStorage throws). A reload starts over at the default.
  Siblings: timer.html (dark full-bleed), timer-small.html (a strip under text).
-->
<style>
  /* The deck's text font. embed_font.py swaps url(MANROPE) for the deck's own
     woff2; opened raw, the page falls back to the system font. */
  @font-face{font-family:Manrope;font-weight:200 800;src:url(MANROPE) format('woff2')}
  :root{
    --ink:#1A2326;      /* all dark text */
    --accent:#0F6B73;   /* primary button, focus */
    --muted:#5A6467;    /* state label, hints */
    --rule:#E1E6E7;     /* hairlines, the dial's unfilled ring */
    --tint:#F1F5F5;     /* chip fill */
    --green:#3B9457;    /* the running ring */
    --coral:#D2553A;    /* last minute + time's up */
    --coral-text:#A83A20;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #FFFFFF; color: var(--ink);
    font: 16px/1.4 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; user-select: none;
  }

  /* One 504x420 stage, scaled to the frame. Everything inside is in stage px. */
  #stage {
    position: relative; width: 504px; height: 420px; flex: none;
    transform-origin: center center;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 6px;
  }

  /* ── the dial ── */
  #dial { position: relative; width: 262px; height: 262px; cursor: pointer; }
  #dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--rule); stroke-width: 12; }
  .sweep {
    fill: none; stroke: var(--green); stroke-width: 12; stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke .4s ease;
  }
  #clock { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  #time {
    font-size: 70px; font-weight: 800; letter-spacing: -2px;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  #state { margin-top: 8px; font-size: 17px; font-weight: 700; color: var(--muted); }
  body.warn .sweep, body.over .sweep { stroke: var(--coral); }
  body.warn #time,  body.over #time  { color: var(--coral); }
  body.over #state { color: var(--coral-text); }
  body.over #dial  { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }

  /* ── the controls ── */
  .row { display: flex; align-items: center; gap: 10px; }
  #controls { margin-top: 26px; gap: 22px; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
    background: #FFFFFF; border: 1.5px solid var(--rule);
    border-radius: 999px; padding: 0 20px; height: 48px;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  .step { width: 48px; padding: 0; font-size: 24px; line-height: 1; background: var(--tint); border-color: var(--tint); }
  #len { min-width: 74px; text-align: center; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #go { background: var(--accent); border-color: var(--accent); color: #FFFFFF; font-size: 18px; min-width: 112px; }
  #go:hover { background: #1B3E86; }
  #reset { font-size: 17px; }

  .hint { margin-top: 18px; font-size: 16px; color: var(--muted); }
  kbd {
    font: inherit; font-size: 14px; font-weight: 700; border: 1px solid var(--rule);
    border-radius: 5px; padding: 0 6px; color: var(--ink); background: var(--tint);
  }
</style>
</head>
<body>

<div id="stage">
  <div id="dial" title="Click to start / pause">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="92"></circle>
      <circle class="sweep" id="sweep" cx="100" cy="100" r="92"></circle>
    </svg>
    <div id="clock">
      <div id="time" data-no-edit>15:00</div>
      <div id="state" data-no-edit>Ready</div>
    </div>
  </div>

  <div class="row" id="controls">
    <div class="row">
      <button class="step" id="minus" data-no-edit title="One minute less">&minus;</button>
      <div id="len" data-no-edit>15 min</div>
      <button class="step" id="plus" data-no-edit title="One minute more">+</button>
    </div>
    <div class="row">
      <button id="go" data-no-edit>Start</button>
      <button id="reset" data-edit="reset">Reset</button>
    </div>
  </div>

  <div class="hint"><kbd data-no-edit>Space</kbd> <span data-edit="hint-play">start / pause</span><span data-no-edit> &nbsp;·&nbsp; </span><kbd data-no-edit>&uarr;</kbd><kbd data-no-edit>&darr;</kbd> <span data-edit="hint-step">&plusmn;1 min</span><span data-no-edit> &nbsp;·&nbsp; </span><kbd data-no-edit>R</kbd> <span data-edit="hint-reset">reset</span></div>
</div>

<script>
/* ═════════════════════════════ CONFIG ═════════════════════════════ */

const DEFAULT_MIN = 15;      // what the slide opens at
const MIN_MIN     = 1;       // the adjustable floor
const MAX_MIN     = 60;      // and ceiling
const WARN_SEC    = 60;      // the last stretch turns coral
const STAGE_W = 504, STAGE_H = 420;

/* ═════════════════════════════ ENGINE ═════════════════════════════ */

const $ = (id) => document.getElementById(id);
// Editable words (assets/figure.html): fixed labels carry data-edit=KEY; words
// the script writes per state read through T(KEY, default), so a deck can
// reword them. The clock digits, the minute readout and the -/+ glyphs are
// not labels (data-no-edit).
const T = (k, d) => (window.TESSERA_EMBED && TESSERA_EMBED.text) ? TESSERA_EMBED.text(k, d) : d;
const R = 92, CIRC = 2 * Math.PI * R;

let minutes = clamp(DEFAULT_MIN);
let total   = minutes * 60;   // the length the sweep is drawn against
let left    = total;          // seconds remaining
let running = false;
let endAt   = 0;              // wall-clock ms the run ends at
let raf     = 0;

$("sweep").style.strokeDasharray = CIRC;
$("minus").addEventListener("click", () => setMinutes(minutes - 1));
$("plus").addEventListener("click",  () => setMinutes(minutes + 1));
$("go").addEventListener("click", toggle);
$("dial").addEventListener("click", toggle);
$("reset").addEventListener("click", reset);

document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowUp")    { e.preventDefault(); setMinutes(minutes + 1); }
  else if (e.key === "ArrowDown")  { e.preventDefault(); setMinutes(minutes - 1); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); reset(); }
});

/* keep the stage filling whatever box the slide gives it */
const fit = () => {
  if (!window.innerWidth || !window.innerHeight) return;
const s = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  $("stage").style.transform = `scale(${s})`;
};
window.addEventListener("resize", fit);
fit();
/* A frame can run this before it has a size (a slideshow started on this slide):
   never scale to 0, and fit again once the frame is laid out. */
window.addEventListener("load", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
setInterval(fit, 1000);


function clamp(m) { return Math.max(MIN_MIN, Math.min(MAX_MIN, Math.round(m))); }

function setMinutes(m) {
  const next = clamp(m);
  if (next === minutes) { paint(); return; }
  if (running) {
    // adjusting mid-run moves the finish line, it does not restart the clock
    endAt += (next - minutes) * 60000;
    left = Math.max(0, (endAt - Date.now()) / 1000);
  } else if (left === total || left <= 0) {
    left = next * 60;                          // fresh or finished: start over
  } else {
    left = Math.max(1, left + (next - minutes) * 60);   // paused: shift it
  }
  minutes = next;
  total = minutes * 60;
  paint();
}

function toggle() {
  if (left <= 0) { reset(); return; }
  running = !running;
  if (running) { endAt = Date.now() + left * 1000; tick(); }
  else { cancelAnimationFrame(raf); left = Math.max(0, (endAt - Date.now()) / 1000); }
  paint();
}

function reset() {
  running = false;
  cancelAnimationFrame(raf);
  total = minutes * 60;
  left = total;
  paint();
}

function tick() {
  left = Math.max(0, (endAt - Date.now()) / 1000);
  paint();
  if (left <= 0) { running = false; paint(); return; }
  raf = requestAnimationFrame(tick);
}

function paint() {
  const shown = Math.max(0, Math.ceil(left - 0.0001));
  const mm = Math.floor(shown / 60), ss = shown % 60;
  $("time").textContent = `${mm}:${String(ss).padStart(2, "0")}`;
  $("len").textContent = `${minutes} min`;

  const over = left <= 0;
  const frac = over ? 1 : (total > 0 ? Math.max(0, Math.min(1, left / total)) : 0);
  $("sweep").style.strokeDashoffset = CIRC * (1 - frac);

  document.body.classList.toggle("warn", !over && left <= WARN_SEC);
  document.body.classList.toggle("over", over);

  $("state").textContent = over ? T("state-time", "Time's up") : running ? T("state-running", "Running")
                         : (left === total ? T("state-ready", "Ready") : T("state-paused", "Paused"));
  $("go").textContent    = over ? T("go-again", "Again") : running ? T("go-pause", "Pause")
                         : (left === total ? T("go-start", "Start") : T("go-resume", "Resume"));
  $("minus").disabled = minutes <= MIN_MIN;
  $("plus").disabled  = minutes >= MAX_MIN;
}

paint();
</script>
</body>
</html>

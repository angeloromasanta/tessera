<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Countdown</title>
<!--
  A reusable countdown for an `embed` slide.

  Drawn for the frame md_to_deck gives a titled embed: 1280 x 500. It scales
  itself to whatever box it actually lands in, so the same asset works on any
  slide.

  Adjustable 3-45 minutes, live, on stage:
    - the - / + chips step one minute
    - the preset chips jump to a common length
    - Up / Down arrows do the same from the keyboard
    - Space starts and pauses, R resets
  To change the DEFAULT the slide opens at, edit DEFAULT_MIN below.

  Sandbox rules it obeys: one file, no CDN, no storage (the frame runs at an
  opaque origin, so localStorage throws). A reload starts over at the default.
-->
<style>
  /* The deck's text font. embed_font.py swaps url(MANROPE) for the deck's own
     woff2; opened raw, the page falls back to the system font. */
  @font-face{font-family:Manrope;font-weight:200 800;src:url(MANROPE) format('woff2')}
  :root{
    /* figure.html's palette, copied verbatim — the ONLY colours a figure uses */
    --ink:#1A2326;      /* all dark text */
    --navy:#0D2A2F;     /* dark FILLS only (a header bar, a dark card) */
    --accent:#0F6B73;   /* structure, emphasis fills, arrows, header rules */
    --sky:#2B6CB0;      /* a second blue, only when categories need one */
    --muted:#5A6467;    /* secondary text, eyebrows, legends */
    --faint:#A7AFB1;    /* disabled / greyed-out text */
    --line:#C7CFD1;     /* axes, dead marks */
    --rule:#D7DEDF;     /* hairlines, dividers */
    --tint:#F1F5F5;     /* neutral card fill */
    --blue-tint:#E2F0F1;
    --amber:#BF831A;  --amber-text:#8E5F00; --amber-tint:#FCF0DA;
    --green:#3B9457;  --green-text:#2B7041; --green-tint:#E3F2E6;
    --coral:#D2553A;  --coral-text:#A83A20; --coral-tint:#FBE8E2;
    /* dark-stage extras: this timer runs full-bleed ON --navy, not on the
       white --tint card figure.html assumes, so it needs its own ink / muted
       / line / go tuned for that background — no equivalent above. */
    --stage:       var(--navy);            /* full-bleed background */
    --stage-ink:   #FFFFFF;                /* text on --stage */
    --stage-muted: #8E97BC;                /* secondary text on --stage */
    --stage-line:  rgba(255,255,255,.16);  /* control borders on --stage */
    --stage-track: rgba(255,255,255,.10);  /* the dial's unfilled ring */
    --stage-hover: rgba(255,255,255,.09);  /* button hover fill */
    --stage-hover-line: rgba(255,255,255,.4); /* button hover border */
    --go:       #7A5BBF;                   /* running/complete ring — lighter than --green, made for navy */
    --go-hover: #7fdcc7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--stage); color: var(--stage-ink);
    font: 16px/1.4 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center;
  }

  /* One 1280x500 stage, scaled to the frame. Everything inside is in stage px. */
  #stage {
    position: relative; width: 1280px; height: 500px;
    transform-origin: center center;
    display: grid; grid-template-columns: 500px 1fr; align-items: center;
    padding: 0 72px; gap: 56px;
  }

  /* ── the dial ── */
  #dial { position: relative; width: 400px; height: 400px; justify-self: center; }
  #dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--stage-track); stroke-width: 18; }
  .sweep {
    fill: none; stroke: var(--go); stroke-width: 18; stroke-linecap: round;
    transition: stroke-dashoffset .3s linear, stroke .4s ease;
  }
  #clock {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center;
  }
  #time {
    font-size: 104px; font-weight: 800; letter-spacing: -3px;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  #state {
    margin-top: 10px; font-size: 15px; letter-spacing: 2.4px;
    text-transform: uppercase; color: var(--stage-muted); font-weight: 700;
  }
  body.warn  .sweep { stroke: var(--amber); }
  body.warn  #time  { color: var(--amber); }
  body.over  .sweep { stroke: var(--coral); }
  body.over  #time  { color: var(--coral); }
  body.over  #state { color: var(--coral); }
  body.over  #dial  { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  /* ── the controls ── */
  #panel { display: flex; flex-direction: column; gap: 26px; max-width: 600px; }
  h1 { margin: 0; font-size: 15px; letter-spacing: 3px; text-transform: uppercase;
       color: var(--stage-muted); font-weight: 700; }

  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  button {
    font: inherit; font-weight: 700; cursor: pointer; color: var(--stage-ink);
    background: transparent; border: 1.5px solid var(--stage-line);
    border-radius: 999px; padding: 12px 22px; min-height: 48px;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled) { background: var(--stage-hover); border-color: var(--stage-hover-line); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .3; cursor: default; }

  .step { width: 56px; padding: 12px 0; font-size: 24px; line-height: 1; text-align: center; }
  .len  { font-variant-numeric: tabular-nums; font-size: 15px; padding: 10px 16px; min-height: 42px; }
  .len.on { background: var(--accent); border-color: var(--accent); }

  #go {
    background: var(--go); border-color: var(--go); color: var(--navy);
    font-size: 20px; padding: 16px 44px; min-height: 60px; letter-spacing: .3px;
  }
  #go:hover { background: var(--go-hover); border-color: var(--go-hover); }
  #reset { padding: 16px 30px; min-height: 60px; font-size: 17px; }

  .lab { font-size: 13px; letter-spacing: 1.8px; text-transform: uppercase;
         color: var(--stage-muted); font-weight: 700; width: 100%; }
  .hint { font-size: 13px; color: var(--stage-muted); }
  kbd {
    font: inherit; font-size: 12px; font-weight: 700; border: 1px solid var(--stage-line);
    border-radius: 5px; padding: 1px 6px; color: var(--stage-ink);
  }
</style>
</head>
<body>

<div id="stage">
  <div id="dial">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="track" cx="100" cy="100" r="86"></circle>
      <circle class="sweep" id="sweep" cx="100" cy="100" r="86"></circle>
    </svg>
    <div id="clock">
      <div id="time" data-no-edit>15:00</div>
      <div id="state" data-no-edit>Ready</div>
    </div>
  </div>

  <div id="panel">
    <h1 id="heading" data-edit="heading">Countdown</h1>

    <div>
      <div class="lab" data-edit="panel-length">Length</div>
      <div class="row" style="margin-top:10px">
        <button class="step" id="minus" data-no-edit title="One minute less">&minus;</button>
        <button class="step" id="plus" data-no-edit  title="One minute more">+</button>
        <div class="row" id="presets" style="gap:8px"></div>
      </div>
    </div>

    <div class="row">
      <button id="go" data-no-edit>Start</button>
      <button id="reset" data-edit="reset">Reset</button>
    </div>

    <div class="hint">
      <kbd data-no-edit>Space</kbd> <span data-edit="hint-play">start / pause</span><span data-no-edit> &nbsp;·&nbsp; </span><kbd data-no-edit>&uarr;</kbd><kbd data-no-edit>&darr;</kbd> <span data-edit="hint-step">&plusmn;1 min</span><span data-no-edit>
      &nbsp;·&nbsp; </span><kbd data-no-edit>R</kbd> <span data-edit="hint-reset">reset</span><span data-no-edit> &nbsp;·&nbsp; </span><span data-edit="hint-range">3&ndash;45 minutes</span>
    </div>
  </div>
</div>

<script>
/* ═════════════════════════════ CONFIG ═════════════════════════════ */

const DEFAULT_MIN = 18;      // what the slide opens at
const MIN_MIN     = 3;       // the adjustable floor
const MAX_MIN     = 45;      // and ceiling
const PRESETS     = [3, 5, 10, 15, 18, 20, 30, 45];
const HEADING     = "Countdown";
const CHIME       = true;    // three tones when it hits zero

/* ═════════════════════════════ ENGINE ═════════════════════════════ */

const $ = (id) => document.getElementById(id);
// Editable words (assets/figure.html): fixed labels carry data-edit=KEY; words
// the script writes per state read through T(KEY, default), so a deck can
// reword them. The clock digits, the preset numbers and the -/+ glyphs are
// not labels (data-no-edit).
const T = (k, d) => (window.TESSERA_EMBED && TESSERA_EMBED.text) ? TESSERA_EMBED.text(k, d) : d;
const R = 86, CIRC = 2 * Math.PI * R;

let minutes = clamp(DEFAULT_MIN);
let left    = minutes * 60;   // seconds remaining
let running = false;
let endAt   = 0;              // wall-clock ms the run ends at
let raf     = 0;
let chimed  = false;

$("heading").textContent = T("heading", HEADING);
$("sweep").style.strokeDasharray = CIRC;

/* presets */
for (const m of PRESETS) {
  const b = document.createElement("button");
  b.className = "len";
  b.dataset.min = m;
  b.setAttribute("data-no-edit", "");   // a number, not a label
  b.textContent = m;
  b.addEventListener("click", () => setMinutes(m));
  $("presets").appendChild(b);
}

$("minus").addEventListener("click", () => setMinutes(minutes - 1));
$("plus").addEventListener("click",  () => setMinutes(minutes + 1));
$("go").addEventListener("click", toggle);
$("reset").addEventListener("click", reset);

document.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Spacebar") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowUp")    { e.preventDefault(); setMinutes(minutes + 1); }
  else if (e.key === "ArrowDown")  { e.preventDefault(); setMinutes(minutes - 1); }
  else if (e.key === "r" || e.key === "R") { e.preventDefault(); reset(); }
});

/* keep the 1280x500 stage filling whatever box the slide gives it */
const fit = () => {
  if (!window.innerWidth || !window.innerHeight) return;
const s = Math.min(window.innerWidth / 1280, window.innerHeight / 500);
  $("stage").style.transform = `scale(${s})`;
};
window.addEventListener("resize", fit);
fit();
/* A frame can run this before it has a size (a slideshow started on this slide):
   never scale to 0, and fit again once the frame is laid out. */
window.addEventListener("load", fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
setInterval(fit, 1000);


function clamp(m) { return Math.max(MIN_MIN, Math.min(MAX_MIN, Math.round(m))); }

function setMinutes(m) {
  const next = clamp(m);
  if (next === minutes && !running) { paint(); return; }
  minutes = next;
  if (running) {
    // adjusting mid-run moves the finish line, it does not restart the clock
    endAt += (minutes * 60 - totalFor()) * 1000;
    _total = minutes * 60;
    left = Math.max(0, (endAt - Date.now()) / 1000);
  } else {
    _total = minutes * 60;
    left = _total;
    chimed = false;
  }
  paint();
}

// the length the current run was started at — the sweep is drawn against it
let _total = minutes * 60;
function totalFor() { return _total; }

function toggle() {
  if (left <= 0) { reset(); return; }
  running = !running;
  if (running) {
    endAt = Date.now() + left * 1000;
    tick();
  } else {
    cancelAnimationFrame(raf);
    left = Math.max(0, (endAt - Date.now()) / 1000);
  }
  paint();
}

function reset() {
  running = false;
  cancelAnimationFrame(raf);
  _total = minutes * 60;
  left = _total;
  chimed = false;
  paint();
}

function tick() {
  left = Math.max(0, (endAt - Date.now()) / 1000);
  paint();
  if (left <= 0) {
    running = false;
    if (CHIME && !chimed) { chimed = true; chime(); }
    paint();
    return;
  }
  raf = requestAnimationFrame(tick);
}

function paint() {
  const secs = Math.ceil(left - 0.0001);
  const shown = Math.max(0, secs);
  const mm = Math.floor(shown / 60), ss = shown % 60;
  $("time").textContent = `${mm}:${String(ss).padStart(2, "0")}`;

  const frac = _total > 0 ? Math.max(0, Math.min(1, left / _total)) : 0;
  $("sweep").style.strokeDashoffset = CIRC * (1 - frac);

  const over = left <= 0;
  const warn = !over && left <= 60;
  document.body.classList.toggle("warn", warn);
  document.body.classList.toggle("over", over);

  $("state").textContent = over ? T("state-time", "Time") : running ? T("state-running", "Running")
                         : (left === _total ? T("state-ready", "Ready") : T("state-paused", "Paused"));
  $("go").textContent    = over ? T("go-again", "Again") : running ? T("go-pause", "Pause")
                         : (left === _total ? T("go-start", "Start") : T("go-resume", "Resume"));

  $("minus").disabled = minutes <= MIN_MIN;
  $("plus").disabled  = minutes >= MAX_MIN;
  for (const b of $("presets").children) {
    b.classList.toggle("on", Number(b.dataset.min) === minutes);
  }
}

/** Three soft tones. WebAudio needs a user gesture first — the Start click is
 *  one, so by the time this fires the context is allowed to make sound. */
function chime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ac = new Ctx();
    [0, 0.42, 0.84].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine";
      o.frequency.value = i === 2 ? 784 : 587.33;   // D5 D5 G5
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.34);
      o.connect(g).connect(ac.destination);
      o.start(ac.currentTime + t);
      o.stop(ac.currentTime + t + 0.4);
    });
  } catch (e) { /* no audio in this sandbox — the flashing dial still says it */ }
}

paint();
</script>
</body>
</html>
